name: Script Unit Tests (Pester)

on:
  push:
    branches: [main]
    paths:
      - "V3/CI/Scripts/**"
      - "Tests/V3/CI/**"
      - ".github/workflows/test-scripts.yml"
  pull_request:
    branches: [main]
    paths:
      - "V3/CI/Scripts/**"
      - "Tests/V3/CI/**"
      - ".github/workflows/test-scripts.yml"

jobs:
  pester:
    name: Pester — ${{ matrix.os }}
    # ScenarioCoverage.cs gira su agent ADO Linux e Windows: la suite gira su entrambi.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git identity (necessario per i test che creano commit)
        run: |
          git config --global user.email "pester@ci.local"
          git config --global user.name "Pester CI"

      - name: Setup .NET SDK (ScenarioCoverage.cs è una file-based app)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Java 17 (Structurizr CLI di Test-Documentation.ps1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js (parser Mermaid di Test-Documentation.ps1)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Pester 5
        shell: pwsh
        run: |
          # PSGallery download fails intermittently on the runners: the image's Pester is used when it is
          # already 5.x, otherwise the download is retried before failing.
          if (Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'5.0.0' }) { return }
          foreach ($attempt in 1..3) {
            try { Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck -Scope CurrentUser -ErrorAction Stop; return }
            catch { if ($attempt -eq 3) { throw }; Start-Sleep -Seconds (15 * $attempt) }
          }

      # Gli script installano gli strumenti (jar, binari, pacchetti npm, Chrome headless) sotto
      # AGENT_TOOLSDIRECTORY in cartelle per versione: la cache vale finche' non cambiano gli script o i
      # lockfile che fissano le versioni, e le chiavi precedenti dello stesso sistema ne riusano il resto.
      - name: Restore tools cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tools
          key: pester-tools-${{ runner.os }}-${{ hashFiles('V3/CI/Scripts/**/package-lock.json', 'V3/CI/Scripts/Arc42/PlantUml.ps1', 'V3/CI/Scripts/Browser/Browser.ps1', 'V3/CI/Scripts/C4/Structurizr.ps1', 'V3/CI/Scripts/Mermaid/Mermaid.ps1', 'V3/CI/Scripts/Pandoc/Pandoc.ps1', 'V3/CI/Scripts/Reference/ReferenceSources.ps1', 'V3/CI/Scripts/Release/GitCliff.ps1') }}
          restore-keys: |
            pester-tools-${{ runner.os }}-

      - name: Run Pester tests
        shell: pwsh
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/tools
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = "Tests/V3/CI/Scripts/"
          $config.Output.Verbosity = "Detailed"
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = "pester-results.xml"
          $config.TestResult.OutputFormat = "JUnitXml"
          $config.Run.Exit = $true   # exit 1 se almeno un test fallisce

          Invoke-Pester -Configuration $config

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Pester Results (${{ matrix.os }})
          path: pester-results.xml
          reporter: java-junit
