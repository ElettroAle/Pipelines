name: Static Analysis

on:
  push:
    branches: ["**"]
    paths:
      - "V3/**"
      - "V4/**"
      - "Tests/Static/**"
      - ".github/workflows/test-static.yml"
  pull_request:
    branches: [main]
    paths:
      - "V3/**"
      - "V4/**"
      - "Tests/Static/**"

jobs:
  static-analysis:
    name: YAML Lint + Reference + Parameter Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Tests/Static/requirements.txt

      - name: Install dependencies
        run: pip install -r Tests/Static/requirements.txt

      - name: YAML Lint (V3/, V4/)
        run: yamllint -c Tests/Static/.yamllint.yaml V3/ V4/

      - name: Check template references
        run: python Tests/Static/check-references.py

      - name: Check parameter contracts
        run: python Tests/Static/check-parameters.py

      - name: Check SPDX license headers
        run: python Tests/Static/check-spdx.py
