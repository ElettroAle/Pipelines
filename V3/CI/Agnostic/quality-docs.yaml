# ── CI Agnostic: Quality Docs ─────────────────────────────────────────────────
#
# Quality gate per i repository di documentazione: Gitleaks, verifica del
# corpus degli Architecture Decision Records e verifica della documentazione
# architetturale (arc42, modello C4, diagrammi, guida di stile).
#
# Il repo consumer dichiara il repository resource con alias `infrastructure`:
# gli script di verifica vivono in questo repo.
#
# Parametri
# ─────────
#   checkoutRepository → repository da fare checkout [REQUIRED]
#   adrMode            → off | warn | enforce (default: enforce)
#   decisionsDirectory → cartella degli ADR (default: docs/decisions)
#   docsMode           → off | warn | enforce (default: off, finché il repo non ha la documentazione)
#   docsDirectory      → cartella delle sezioni arc42 (default: docs/architecture)
#   styleRules         → guida di stile in JSON (default: docs/style.json)
#   workspaceDsl       → modello C4 in Structurizr DSL (default: docs/architecture/model/workspace.dsl)
#   pool               → pool del job (default: hosted ubuntu-latest, richiesto da Gitleaks via docker)
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: checkoutRepository
    type: string

  - name: adrMode
    type: string
    default: 'enforce'
    values: ['off', 'warn', 'enforce']

  - name: decisionsDirectory
    type: string
    default: 'docs/decisions'

  - name: docsMode
    type: string
    default: 'off'
    values: ['off', 'warn', 'enforce']

  - name: docsDirectory
    type: string
    default: 'docs/architecture'

  - name: styleRules
    type: string
    default: 'docs/style.json'

  - name: workspaceDsl
    type: string
    default: 'docs/architecture/model/workspace.dsl'

  - name: pool
    type: object
    default:
      vmImage: 'ubuntu-latest'

stages:
  - template: ../Common/quality.yaml
    parameters:
      checkoutRepository: ${{ parameters.checkoutRepository }}
      pool: ${{ parameters.pool }}
      checkoutPipelineTemplates: true
      buildAndTestSteps:
        - template: ../Common/Steps/adr-verify.yaml
          parameters:
            mode: ${{ parameters.adrMode }}
            decisionsDirectory: ${{ parameters.decisionsDirectory }}
        - template: ../Common/Steps/architecture-docs-verify.yaml
          parameters:
            mode: ${{ parameters.docsMode }}
            docsDirectory: ${{ parameters.docsDirectory }}
            styleRules: ${{ parameters.styleRules }}
            workspaceDsl: ${{ parameters.workspaceDsl }}
            decisionsDirectory: ${{ parameters.decisionsDirectory }}
