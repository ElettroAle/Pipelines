# ── CI Agnostic: Quality Angular ───────────────────────────────────────────────
#
# Template di Quality gate per progetti Angular, agnostico rispetto al workflow Git.
# Non include validazione SemVer né versionamento.
#
# Può essere precursore di GitFlow/quality-angular.yaml, che aggiunge
# la validazione del titolo PR (Conventional Commits).
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: projectName
    type: string
    default: '$(Build.Repository.Name)'

  - name: checkoutRepository
    type: string

  - name: enableSonar
    type: boolean
    default: false

  - name: sonarServiceConnection
    type: string
    default: 'SonarCloud'

  - name: sonarOrganization
    type: string
    default: ''

  - name: sonarProjectKey
    type: string
    default: ''

  - name: sonarExtraProperties
    type: string
    default: 'sonar.javascript.lcov.reportPaths=coverage/lcov.info'

  # 'src' e non '.': il default di angular-sonar.yaml analizzerebbe anche
  # e2e/scripts/config di root, oltre al codice applicativo.
  - name: sonarSources
    type: string
    default: 'src'

  - name: workspaceClean
    type: string
    default: 'none'
    values: ['none', 'outputs', 'resources', 'all']

  - name: pool
    type: object
    default:
      vmImage: 'ubuntu-latest'

variables:
  - name: nodeVersion
    value: '22.x'
  - group: "common-quality"

stages:
  - template: ../Common/quality.yaml
    parameters:
      checkoutRepository: ${{ parameters.checkoutRepository }}
      pool: ${{ parameters.pool }}
      workspaceClean: ${{ parameters.workspaceClean }}
      buildAndTestSteps:
        - template: ../Common/Steps/angular-quality.yaml
        - template: ../Common/Steps/angular-sonar.yaml
          parameters:
            enableSonar: ${{ parameters.enableSonar }}
            sonarServiceConnection: ${{ parameters.sonarServiceConnection }}
            sonarOrganization: ${{ parameters.sonarOrganization }}
            sonarProjectKey: ${{ parameters.sonarProjectKey }}
            sonarExtraProperties: ${{ parameters.sonarExtraProperties }}
            sonarSources: ${{ parameters.sonarSources }}
