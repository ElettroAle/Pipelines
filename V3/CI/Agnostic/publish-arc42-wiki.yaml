# ── CI Agnostic: Publish arc42 wiki ───────────────────────────────────────────
#
# Pubblica un documento arc42 nella wiki di progetto di Azure DevOps: il checkout del documento,
# dei template e della wiki, poi lo step CI/Common/Steps/arc42-wiki-publish.yaml.
#
# Il repo consumer dichiara due repository resource: `infrastructure` (questo repo, con gli
# script) e il repository della wiki, il cui alias passa in wikiRepository. Con "Protect access
# to repositories in YAML pipelines" il System.AccessToken scrive solo nei repository dichiarati.
# Con draftRepository, l'alias di una repository resource sul ramo di bozza del documento, la pubblicazione
# legge anche la bozza e aggiunge le pagine che essa cambia accanto a quelle ufficiali.
#
# Parametri
# ─────────
#   checkoutRepository → repository del documento [REQUIRED]
#   wikiRepository     → alias della repository resource della wiki [REQUIRED]
#   language           → lingua del documento, es. 'IT' o 'EN' (V3/CI/Scripts/Common/Languages) [REQUIRED]
#   wikiBranch         → ramo della wiki (default: wikiMaster, il ramo della wiki di progetto)
#   wikiRoot           → pagina della wiki sotto cui nasce il documento (default: il nome
#                        dell'architettura nella lingua del documento, es. Architettura o Architecture)
#   docsDirectory      → cartella delle sezioni (default: docs/architecture)
#   decisionsDirectory → cartella degli ADR (default: docs/decisions)
#   composeSteps       → step che compongono il documento prima della pubblicazione (default: nessuno)
#   documentFormats    → formati del documento unico allegato alla wiki, 'pdf' e 'docx' (default: nessuno)
#   referenceRoot      → radice della reference nella wiki (reference-publish.yaml), i cui link si
#                        aggiungono alle pagine e non al documento unico (default: nessuna)
#   draftRepository    → alias della repository resource del documento sul ramo di bozza (default: nessuna
#                        bozza)
#   draftBranch        → ramo della bozza, nominato nell'avviso delle pagine (default: staging)
#   pool               → pool del job (default: hosted ubuntu-latest)
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: checkoutRepository
    type: string

  - name: wikiRepository
    type: string

  - name: language
    type: string

  - name: wikiBranch
    type: string
    default: 'wikiMaster'

  - name: wikiRoot
    type: string
    default: ''

  - name: docsDirectory
    type: string
    default: 'docs/architecture'

  - name: decisionsDirectory
    type: string
    default: 'docs/decisions'

  - name: composeSteps
    type: stepList
    default: []

  - name: documentFormats
    type: object
    default: []

  - name: referenceRoot
    type: string
    default: ''

  - name: draftRepository
    type: string
    default: ''

  - name: draftBranch
    type: string
    default: 'staging'

  - name: pool
    type: object
    default:
      vmImage: 'ubuntu-latest'

# ─────────────────────────────────────────────────────────────────────────────

stages:
  - stage: Wiki
    displayName: 'Publish to the wiki'
    jobs:
      - job: PublishWiki
        displayName: 'Publish ${{ parameters.docsDirectory }} to the wiki'
        pool: ${{ parameters.pool }}
        steps:
          # The checkout moved to s deletes the default folders the agent creates under s for the other
          # repositories, so it comes last: an earlier one would make the others clone again with a warning.
          - checkout: infrastructure
            path: pipeline-templates

          - checkout: ${{ parameters.wikiRepository }}
            path: wiki

          - ${{ if ne(parameters.draftRepository, '') }}:
            - checkout: ${{ parameters.draftRepository }}
              path: draft

          - checkout: ${{ parameters.checkoutRepository }}
            path: s

          - template: ../Common/Steps/document-language.yaml
            parameters:
              language: ${{ parameters.language }}

          - ${{ parameters.composeSteps }}

          - template: ../Common/Steps/arc42-wiki-publish.yaml
            parameters:
              language: ${{ parameters.language }}
              wikiDirectory: '$(Pipeline.Workspace)/wiki'
              wikiBranch: ${{ parameters.wikiBranch }}
              wikiRoot: ${{ parameters.wikiRoot }}
              docsDirectory: ${{ parameters.docsDirectory }}
              decisionsDirectory: ${{ parameters.decisionsDirectory }}
              sourcesDirectory: '$(Pipeline.Workspace)/s'
              documentFormats: ${{ parameters.documentFormats }}
              referenceRoot: ${{ parameters.referenceRoot }}
              ${{ if ne(parameters.draftRepository, '') }}:
                draftDocsDirectory: '$(Pipeline.Workspace)/draft/${{ parameters.docsDirectory }}'
                draftDecisionsDirectory: '$(Pipeline.Workspace)/draft/${{ parameters.decisionsDirectory }}'
              draftBranch: ${{ parameters.draftBranch }}
