# ── CI Module: Quality (GitFlow) ──────────────────────────────────────────────
#
# Template riusabile per la Quality gate con governance GitFlow.
#
# Rispetto alla versione agnostica (CI/Common/quality.yaml), aggiunge:
#   - Job ValidatePRTitle: verifica con git-cliff che il titolo della PR o almeno uno
#     dei suoi commit rispetti i Conventional Commits, sulle PR verso i branch di
#     titleGateBranches
#
# I passi tech-specific (build, test, coverage) vengono iniettati
# tramite il parametro `buildAndTestSteps`.
#
# Parametri
# ─────────
#   projectName        → nome del repo applicativo (default: nome del repo ADO)
#   buildAndTestSteps  → stepList iniettata nel job BuildAndTest dopo Gitleaks
#   checkoutRepository → repository da fare checkout [REQUIRED]
#   gitLeaksNoGit      → passa --no-git a Gitleaks (default: true)
#   checkoutPipelineTemplates → checkout del repo 'infrastructure' nel job BuildAndTest (default: false)
#   timeoutInMinutes   → timeout del job BuildAndTest (default: 30)
#   workspaceClean     → pulizia workspace prima del job (default: 'none', nessuna)
#   titleGateMode      → off | warn | enforce (default: enforce)
#   titleGateBranches  → branch target, separati da virgola, su cui gira il gate (default: dev,staging,main)
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: projectName
    type: string
    default: '$(Build.Repository.Name)'

  - name: buildAndTestSteps
    type: stepList
    default: []

  - name: checkoutRepository
    type: string

  - name: gitLeaksNoGit
    type: boolean
    default: true

  - name: pool
    type: object
    default:
      vmImage: 'ubuntu-latest'

  - name: timeoutInMinutes
    type: number
    default: 30

  - name: workspaceClean
    type: string
    default: 'none'
    values: ['none', 'outputs', 'resources', 'all']

  - name: checkoutPipelineTemplates
    type: boolean
    default: false

  # Gate sui Conventional Commits della PR: fallisce solo se né il titolo né alcun
  # commit lo è. 'warn' segnala senza bloccare, per un consumer che non lo vuole bloccante.
  - name: titleGateMode
    type: string
    default: 'enforce'
    values: ['off', 'warn', 'enforce']

  - name: titleGateBranches
    type: string
    default: 'dev,staging,main'

# ─────────────────────────────────────────────────────────────────────────────

stages:
  - stage: Quality
    displayName: 'Quality Checks'
    jobs:

      # Una condition custom sostituisce il controllo di cancellazione implicito:
      # senza not(canceled()) il job parte anche quando la run e' stata annullata.
      - job: ValidatePRTitle
        displayName: 'Validate SemVer Title'
        pool: ${{ parameters.pool }}
        condition: and(not(canceled()), eq(variables['Build.Reason'], 'PullRequest'), ne('${{ parameters.titleGateMode }}', 'off'))
        steps:
          - checkout: ${{ parameters.checkoutRepository }}
            path: s/${{ parameters.projectName }}
            fetchDepth: 10

          - checkout: infrastructure
            path: s/infrastructure

          - task: PowerShell@2
            displayName: 'Verify Conventional PR Title'
            inputs:
              filePath: '$(Build.SourcesDirectory)/infrastructure/V3/CI/Scripts/Verify-SemVer.ps1'
              workingDirectory: '$(Build.SourcesDirectory)/${{ parameters.projectName }}'
            env:
              TARGET_BRANCH: $(System.PullRequest.TargetBranch)
              GATED_BRANCHES: ${{ parameters.titleGateBranches }}
              GATE_MODE: ${{ parameters.titleGateMode }}
              PR_ID: $(System.PullRequest.PullRequestId)
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

      - template: ../../Common/Jobs/quality-build-and-test.yaml
        parameters:
          checkoutRepository: ${{ parameters.checkoutRepository }}
          gitLeaksNoGit: ${{ parameters.gitLeaksNoGit }}
          buildAndTestSteps: ${{ parameters.buildAndTestSteps }}
          pool: ${{ parameters.pool }}
          timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
          workspaceClean: ${{ parameters.workspaceClean }}
          checkoutPipelineTemplates: ${{ parameters.checkoutPipelineTemplates }}
          dependsOn: [ValidatePRTitle]
          condition: and(not(canceled()), in(dependencies.ValidatePRTitle.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'))
