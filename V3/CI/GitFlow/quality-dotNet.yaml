# ── CI GitFlow: Quality DotNet ─────────────────────────────────────────────────
#
# Template di Quality gate per progetti .NET con governance GitFlow.
#
# Rispetto alla versione agnostica (CI/Agnostic/quality-dotNet.yaml), aggiunge:
#   - Validazione titolo PR (Conventional Commits / SemVer) verso branch protetti
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: projectName
    type: string
    default: '$(Build.Repository.Name)'

  - name: checkoutRepository
    type: string

  - name: gitLeaksNoGit
    type: boolean
    default: true

  # '**/*.csproj' fa girare un `dotnet build` per ogni progetto. Passare
  # '**/*.sln' per una build unica: misurata 1m29s contro 2m42s su
  # Aidea.Dxp.AI (27 progetti).
  #
  # Solo prestazioni, NON risolve il disco pieno: le due strategie lasciano lo
  # stesso spazio libero a fine build (252 MB misurati su entrambe). Per lo
  # spazio serve `freeDiskSpace` nel job BuildAndTest.
  - name: buildProjects
    type: string
    default: '**/*.csproj'

  - name: timeoutInMinutes
    type: number
    default: 30

  - name: enableSonar
    type: boolean
    default: false

  - name: sonarServiceConnection
    type: string
    default: 'SonarCloud'

  - name: sonarOrganization
    type: string
    default: ''

  - name: sonarProjectKey
    type: string
    default: ''

variables:
  - name: dotnetVersion
    value: '10.0.x'
  - name: buildConfiguration
    value: 'Release'
  - name: buildProjects
    value: '**/*.csproj'
  - name: testProjects
    value: '**/*.UnitTest*.csproj'
  - group: "common-quality"

stages:
  - template: ./Modules/quality.yaml
    parameters:
      projectName: ${{ parameters.projectName }}
      checkoutRepository: ${{ parameters.checkoutRepository }}
      gitLeaksNoGit: ${{ parameters.gitLeaksNoGit }}
      timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
      buildAndTestSteps:
        - template: ../Common/Steps/dotnet-nuget-check.yaml
        - template: ../Common/Steps/dotnet-sonar-prepare.yaml
          parameters:
            enableSonar: ${{ parameters.enableSonar }}
            sonarServiceConnection: ${{ parameters.sonarServiceConnection }}
            sonarOrganization: ${{ parameters.sonarOrganization }}
            sonarProjectKey: ${{ parameters.sonarProjectKey }}
        - template: ../Common/Steps/dotnet-build.yaml
          parameters:
            projects: ${{ parameters.buildProjects }}
        - template: ../Common/Steps/dotnet-test.yaml
        - template: ../Common/Steps/dotnet-sonar.yaml
          parameters:
            enableSonar: ${{ parameters.enableSonar }}
            sonarServiceConnection: ${{ parameters.sonarServiceConnection }}
