# ── CI GitFlow: Quality DotNet ─────────────────────────────────────────────────
#
# Template di Quality gate per progetti .NET con governance GitFlow.
#
# Rispetto alla versione agnostica (CI/Agnostic/quality-dotNet.yaml), aggiunge:
#   - Validazione titolo PR (Conventional Commits / SemVer) verso branch protetti
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: projectName
    type: string
    default: '$(Build.Repository.Name)'

  - name: checkoutRepository
    type: string

  - name: gitLeaksNoGit
    type: boolean
    default: true

  # '**/*.csproj' compila un progetto per volta, '**/*.sln' in un colpo solo.
  # Incide sulla durata, non sul footprint su disco.
  - name: buildProjects
    type: string
    default: '**/*.csproj'

  # Il glob dei progetti di test: chi consuma il template decide se il quality
  # gate copre i soli unit test o anche altre suite.
  - name: testProjects
    type: string
    default: '**/*.UnitTest*.csproj'

  - name: timeoutInMinutes
    type: number
    default: 30

  - name: enableSonar
    type: boolean
    default: false

  - name: sonarServiceConnection
    type: string
    default: 'SonarCloud'

  - name: sonarOrganization
    type: string
    default: ''

  - name: sonarProjectKey
    type: string
    default: ''

  # Il default punta al cobertura prodotto da dotnet-test.yaml, che in questo
  # template gira sempre: senza questa property Sonar ignora il file e riporta
  # 0% di coverage pur avendola gia' sul disco dell'agent.
  - name: sonarExtraProperties
    type: string
    default: 'sonar.cs.cobertura.reportsPaths=$(Agent.TempDirectory)/**/coverage.cobertura.xml'

  - name: workspaceClean
    type: string
    default: 'none'
    values: ['none', 'outputs', 'resources', 'all']

  - name: pool
    type: object
    default:
      vmImage: 'ubuntu-latest'

variables:
  - name: dotnetVersion
    value: '10.0.x'
  - name: buildConfiguration
    value: 'Release'
  - group: "common-quality"

stages:
  - template: ./Modules/quality.yaml
    parameters:
      projectName: ${{ parameters.projectName }}
      checkoutRepository: ${{ parameters.checkoutRepository }}
      pool: ${{ parameters.pool }}
      gitLeaksNoGit: ${{ parameters.gitLeaksNoGit }}
      timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
      workspaceClean: ${{ parameters.workspaceClean }}
      buildAndTestSteps:
        # SonarCloud Prepare invoca dotnet direttamente: su agent senza SDK di sistema
        # (self-hosted) va installato prima, non nello step dotnet-build successivo.
        - task: UseDotNet@2
          displayName: 'Install .NET SDK'
          inputs:
            version: '$(dotnetVersion)'
        - template: ../Common/Steps/dotnet-sonar-prepare.yaml
          parameters:
            enableSonar: ${{ parameters.enableSonar }}
            sonarServiceConnection: ${{ parameters.sonarServiceConnection }}
            sonarOrganization: ${{ parameters.sonarOrganization }}
            sonarProjectKey: ${{ parameters.sonarProjectKey }}
            sonarExtraProperties: ${{ parameters.sonarExtraProperties }}
        - template: ../Common/Steps/dotnet-build.yaml
          parameters:
            projects: ${{ parameters.buildProjects }}
            installSdk: false
        # Dopo la build: lo scanner riusa gli asset di restore invece di rifarli.
        - template: ../Common/Steps/dotnet-nuget-check.yaml
          parameters:
            installSdk: false
        - template: ../Common/Steps/dotnet-test.yaml
          parameters:
            testProjects: ${{ parameters.testProjects }}
        - template: ../Common/Steps/dotnet-sonar.yaml
          parameters:
            enableSonar: ${{ parameters.enableSonar }}
            sonarServiceConnection: ${{ parameters.sonarServiceConnection }}
