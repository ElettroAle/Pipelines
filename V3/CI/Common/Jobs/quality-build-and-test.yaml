# ── CI Job: Quality — Build and Test ──────────────────────────────────────────
#
# Job template condiviso per la fase BuildAndTest della Quality gate.
# Esegue il checkout, Gitleaks e gli step tech-specific iniettati dal caller.
#
# Riusato da:
#   CI/Common/quality.yaml
#   CI/GitFlow/Modules/quality.yaml
#
# Parametri
# ─────────
#   checkoutRepository → repository da fare checkout    [REQUIRED]
#   gitLeaksNoGit      → passa --no-git a Gitleaks      (default: false)
#   buildAndTestSteps  → stepList con gli step tech-specific
#   freeDiskSpace      → libera spazio sull'agent hosted (default: true)
#   timeoutInMinutes   → timeout del job                (default: 30)
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: checkoutRepository
    type: string

  - name: gitLeaksNoGit
    type: boolean
    default: false

  - name: buildAndTestSteps
    type: stepList
    default: []

  - name: dependsOn
    type: object
    default: []

  - name: condition
    type: string
    default: 'succeeded()'

  - name: freeDiskSpace
    type: boolean
    default: true

  - name: timeoutInMinutes
    type: number
    default: 30

# ─────────────────────────────────────────────────────────────────────────────

jobs:
  - job: BuildAndTest
    displayName: 'Build, Test and Security'
    pool:
      vmImage: 'ubuntu-latest'
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    # Timeout esplicito: senza di esso il default e' 60 min, e un disco pieno
    # manda MSBuild in retry loop (MSB3026) fino alla morte dell'agent.
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    steps:
      # Misurato sull'immagine ubuntu-24.04 20260720.247.2: l'agent parte con
      # 15 GB liberi, mentre il build di Aidea.Dxp.AI occupa 12,1 GB (8,3 GB di
      # workspace + 3,8 GB di cache NuGet). I 2,9 GB di margine non bastano al
      # job completo, il disco arriva a zero e MSBuild entra in retry loop
      # (MSB3026) finche' l'agent muore.
      #
      # Questa pulizia libera 21,7 GB in ~60s (14689M -> 36349M misurati), e
      # porta lo spazio residuo a fine build da 252 MB a 22 GB.
      #
      # Nota: cambiare strategia di build NON risolve. Una build unica sulla
      # solution e 27 build per progetto lasciano lo stesso spazio (252 MB):
      # il footprint e' quello, indipendentemente da come lo si compila.
      - ${{ if eq(parameters.freeDiskSpace, true) }}:
        - script: |
            echo "Spazio prima della pulizia:"
            df -h /
            sudo rm -rf /usr/local/lib/android \
                        /opt/ghc /usr/local/.ghcup \
                        /opt/hostedtoolcache/CodeQL \
                        /usr/share/swift \
                        /usr/local/share/powershell \
                        /usr/share/miniconda
            echo "Spazio dopo la pulizia:"
            df -h /
          displayName: 'Free disk space'

      - checkout: ${{ parameters.checkoutRepository }}
        fetchDepth: 0

      - template: ../Steps/gitleaks.yaml
        parameters:
          noGit: ${{ parameters.gitLeaksNoGit }}

      - ${{ parameters.buildAndTestSteps }}

      # Consumo disco misurato, non ipotizzato: gira anche a job fallito.
      - script: |
          df -h /
          du -xh "$(Agent.BuildDirectory)" --max-depth=2 2>/dev/null | sort -rh | head -15
        displayName: 'Disk usage report'
        condition: always()
