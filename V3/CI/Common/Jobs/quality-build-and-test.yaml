# ── CI Job: Quality — Build and Test ──────────────────────────────────────────
#
# Job template condiviso per la fase BuildAndTest della Quality gate.
# Esegue il checkout, Gitleaks e gli step tech-specific iniettati dal caller.
#
# Riusato da:
#   CI/Common/quality.yaml
#   CI/GitFlow/Modules/quality.yaml
#
# Parametri
# ─────────
#   checkoutRepository → repository da fare checkout    [REQUIRED]
#   gitLeaksNoGit      → passa --no-git a Gitleaks      (default: false)
#   buildAndTestSteps  → stepList con gli step tech-specific
#   freeDiskSpace      → libera spazio sull'agent hosted (default: true)
#   timeoutInMinutes   → timeout del job                (default: 30)
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: checkoutRepository
    type: string

  - name: gitLeaksNoGit
    type: boolean
    default: false

  - name: buildAndTestSteps
    type: stepList
    default: []

  - name: dependsOn
    type: object
    default: []

  - name: condition
    type: string
    default: 'succeeded()'

  - name: freeDiskSpace
    type: boolean
    default: true

  - name: timeoutInMinutes
    type: number
    default: 30

# ─────────────────────────────────────────────────────────────────────────────

jobs:
  - job: BuildAndTest
    displayName: 'Build, Test and Security'
    pool:
      vmImage: 'ubuntu-latest'
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}
    # Timeout esplicito: senza di esso il default e' 60 min, e un disco pieno
    # manda MSBuild in retry loop (MSB3026) fino alla morte dell'agent.
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    steps:
      # L'immagine hosted ubuntu-latest dichiara solo ~14 GB liberi: un build
      # .NET con dipendenze Azure li esaurisce. Rimuove toolchain non usate.
      - ${{ if eq(parameters.freeDiskSpace, true) }}:
        - script: |
            echo "Spazio prima della pulizia:"
            df -h /
            sudo rm -rf /usr/local/lib/android \
                        /opt/ghc /usr/local/.ghcup \
                        /opt/hostedtoolcache/CodeQL \
                        /usr/share/swift
            echo "Spazio dopo la pulizia:"
            df -h /
          displayName: 'Free disk space'

      - checkout: ${{ parameters.checkoutRepository }}
        fetchDepth: 0

      - template: ../Steps/gitleaks.yaml
        parameters:
          noGit: ${{ parameters.gitLeaksNoGit }}

      - ${{ parameters.buildAndTestSteps }}

      # Consumo disco misurato, non ipotizzato: gira anche a job fallito.
      - script: |
          df -h /
          du -xh "$(Agent.BuildDirectory)" --max-depth=2 2>/dev/null | sort -rh | head -15
        displayName: 'Disk usage report'
        condition: always()
