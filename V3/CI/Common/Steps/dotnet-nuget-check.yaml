# ── CI Step: DotNet NuGet Vulnerability Check ─────────────────────────────────
#
# Step template condiviso per la verifica delle vulnerabilità NuGet in progetti .NET.
# Installa l'SDK e scansiona i pacchetti (diretti e transitivi).
#
# Riusato da:
#   CI/Agnostic/quality-dotNet.yaml
#   CI/GitFlow/quality-dotNet.yaml
#
# Parametri
# ─────────
#   dotnetVersion → versione SDK .NET (default: variabile $(dotnetVersion))
#   installSdk    → installa l'SDK prima della scansione (default: true)
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: dotnetVersion
    type: string
    default: '$(dotnetVersion)'

  # Dopo dotnet-build.yaml l'SDK e' gia' installato e gli asset di restore sono
  # sul disco: reinstallare e ri-restorare raddoppia il costo dello step.
  - name: installSdk
    type: boolean
    default: true

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - ${{ if parameters.installSdk }}:
    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        version: ${{ parameters.dotnetVersion }}

  - script: |
      OUTPUT=$(dotnet list package --vulnerable --include-transitive 2>&1)
      echo "$OUTPUT"
      if echo "$OUTPUT" | grep -q "has the following vulnerable packages"; then
        echo "##[error]Vulnerable NuGet packages detected. Pipeline failed."
        exit 1
      fi
    displayName: 'Check NuGet Vulnerabilities'
