# ── CI Step: Ensure fonts ─────────────────────────────────────────────────────
#
# Garantisce i font di sistema con cui Java misura e disegna il testo, per
# PlantUML: senza fontconfig si ferma con "InternalError ... FontManagerFactory".
# Un agent che li ha gia' non installa nulla; uno che non li ha li installa con
# sudo, una volta per macchina.
#
# Riusato da:
#   CI/Common/Steps/arc42-wiki-publish.yaml
#
# ─────────────────────────────────────────────────────────────────────────────

steps:
  - task: Bash@3
    displayName: 'Ensure fonts (Linux)'
    condition: ne(variables['Agent.OS'], 'Windows_NT')
    inputs:
      targetType: 'inline'
      script: |
        set -euo pipefail

        if command -v fc-list >/dev/null && [ -n "$(fc-list)" ]; then
          echo "Font di sistema gia' presenti"
          exit 0
        fi

        if ! sudo -n true 2>/dev/null; then
          echo "##vso[task.logissue type=error]L'agent non ha font di sistema e il suo utente non ha sudo: servono fontconfig e fonts-dejavu-core."
          exit 1
        fi

        apt="sudo -n apt-get -o DPkg::Lock::Timeout=600 -q"
        DEBIAN_FRONTEND=noninteractive $apt update
        DEBIAN_FRONTEND=noninteractive $apt install -y fontconfig fonts-dejavu-core
