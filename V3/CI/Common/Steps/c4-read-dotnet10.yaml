# ── CI Step: C4 read .NET 10 ──────────────────────────────────────────────────
#
# Lettore .NET 10 del modello C4 generato (V3/CI/Scripts/C4/Read-C4DotNet10Model.ps1), eseguito da
# c4-read.yaml: legge i progetti del checkout del repository sorgente e scrive in fragmentDirectory
# il frammento che c4-generate.yaml unisce. Le applicazioni web e le Function App sono container, i
# progetti di produzione che raggiungono sono componenti; un progetto di un'altra versione di .NET o
# di un tipo che le regole di .NET 10 non riconoscono ferma la lettura.
#
# Riusato da:
#   il consumer, prima di c4-generate.yaml, per un repository sorgente con progetti .NET 10
#
# Parametri
# ─────────
#   mode               → 'off' | 'warn' (segnala senza bloccare) | 'enforce' (default)
#   sourceRepository   → nome del repository sorgente, es. $(Build.Repository.Name)
#   sourceDirectory    → checkout del repository sorgente (default: $(Build.SourcesDirectory))
#   fragmentDirectory  → cartella dei frammenti (default: $(Agent.TempDirectory)/c4-fragments)
#   templatesDirectory → checkout del repo dei template (default: $(Pipeline.Workspace)/pipeline-templates)
#   condition          → condizione del passo, es. per saltarlo quando manca un file (default: succeeded())
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: mode
    type: string
    default: 'enforce'
    values: ['off', 'warn', 'enforce']

  - name: sourceRepository
    type: string
    default: '$(Build.Repository.Name)'

  - name: sourceDirectory
    type: string
    default: '$(Build.SourcesDirectory)'

  - name: fragmentDirectory
    type: string
    default: '$(Agent.TempDirectory)/c4-fragments'

  - name: templatesDirectory
    type: string
    default: '$(Pipeline.Workspace)/pipeline-templates'

  - name: condition
    type: string
    default: 'succeeded()'

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - template: c4-read.yaml
    parameters:
      scriptPath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/C4/Read-C4DotNet10Model.ps1'
      displayName: 'C4 .NET 10 projects'
      mode: ${{ parameters.mode }}
      sourceRepository: ${{ parameters.sourceRepository }}
      sourceDirectory: ${{ parameters.sourceDirectory }}
      fragmentDirectory: ${{ parameters.fragmentDirectory }}
      templatesDirectory: ${{ parameters.templatesDirectory }}
      condition: ${{ parameters.condition }}
