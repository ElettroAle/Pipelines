# ── CI Step: C4 model text ────────────────────────────────────────────────────
#
# Testo del modello C4 di tutto il sistema (V3/CI/Scripts/C4/Write-C4ModelText.ps1): la descrizione di
# ogni elemento, cio' che passa su ogni relazione, le persone e i sistemi esterni con le loro relazioni,
# scritti da un modello linguistico leggendo i frammenti dei lettori di tutti i repository sorgente
# (c4-read-*.yaml), il codice degli elementi, la guida di stile e i documenti di contesto. Un solo testo,
# cosi' ogni persona, sistema esterno e applicazione compare una volta: dopo i container il modello
# rilegge insieme il catalogo di persone e sistemi esterni e unisce le voci che indicano la stessa cosa.
# Infine rivede tutto il modello: un sistema esterno resta solo con una prova citata da reviewEvidence,
# la configurazione di produzione; toglie le relazioni non vere, nomina i container, unisce le copie.
# Una stesura respinta non ferma la pipeline: cio' che la struttura non contiene si toglie e si elenca in
# correctionsFile, i testi mancanti e le frasi troppo lunghe tornano al modello, che riscrive solo quelli
# fino a maxDrafts stesure. Il testo accettato si salva in generatedDirectory e, con progressBranch, sul
# ramo, un container alla volta: rilanciata, la pipeline riparte dai container senza testo accettato. Il
# testo di un container la cui struttura non cambia resta quello accettato. Lo compone c4-generate.yaml,
# da eseguire dopo questo step per ogni repository sorgente. Con provider foundry il modello e' un
# deployment Azure OpenAI e l'accesso passa dalla service connection con un token Entra ID (AzureCLI@2);
# con provider anthropic e' Claude a consumo sull'API Anthropic, il passo e' un PowerShell@2 senza service
# connection e la chiave e' una variabile segreta del consumer, mappata in ANTHROPIC_API_KEY: senza, il
# passo fallisce nominandola. Con progressBranch l'identita' della build deve poter contribuire al
# repository e creare rami.
#
# Riusato da:
#   il consumer, nella pipeline della documentazione che rigenera il modello dopo l'integrazione di un
#   repository sorgente, fra i passi di lettura di tutti i repository sorgente e c4-generate.yaml
#
# Parametri
# ─────────
#   mode                → 'off' | 'warn' (segnala senza bloccare) | 'enforce' (default)
#   provider            → fornitore del modello: 'foundry' (default) | 'anthropic'
#   serviceConnection   → service connection Azure con il ruolo Cognitive Services OpenAI User [REQUIRED con foundry
#                         se mode non e' off]
#   endpoint            → endpoint della risorsa Azure OpenAI, es. https://<nome>.openai.azure.com [REQUIRED con
#                         foundry se mode non e' off]; con anthropic vuoto vuol dire https://api.anthropic.com
#   model               → deployment Foundry o modello Anthropic, es. claude-sonnet-5-5 [REQUIRED se mode non e' off]
#   anthropicApiKey     → chiave dell'API Anthropic, con anthropic (default: $(anthropicApiKey), la variabile
#                         segreta del consumer: una variabile segreta arriva allo script solo cosi')
#   reasoningEffort     → ragionamento del modello (default: high; con anthropic anche xhigh e max)
#   maxDrafts           → stesure massime per container e per il controllo del catalogo (default: 3)
#   sourceRepositories  → repository sorgente del documento separati da virgola [REQUIRED]
#   sourcesDirectory    → cartella con il checkout di ogni repository sorgente in <repository>
#                         (default: $(Pipeline.Workspace)/sources)
#   correctionsFile     → file in cui si elencano le correzioni della generazione, ad esempio per la PR
#                         (default: $(Agent.TempDirectory)/c4-corrections.md)
#   fragmentDirectory   → cartella dei frammenti dei lettori (default: $(Agent.TempDirectory)/c4-fragments)
#   generatedDirectory  → cartella delle parti generate, relativa a workingDirectory (default: docs/architecture/c4/generated)
#   guide               → guida di stile del documento (default: docs/STYLE.md)
#   context             → file o cartelle di contesto del documento, Markdown (default: [docs/decisions])
#   reviewEvidence      → file o cartelle della configurazione di produzione, relativi a sourcesDirectory
#                         (<repository>/<percorso>, con caratteri jolly): le sole prove che tengono un
#                         sistema esterno nel modello (default: nessuna, nessun sistema esterno resta)
#   maxWords            → parole massime di una frase del testo, 0 senza limite (default: 0)
#   abbreviations       → abbreviazioni con il punto che non chiudono una frase (default: nessuna)
#   progressBranch      → ramo del repository del documento che porta il testo accettato (default: nessuno)
#   workingDirectory    → checkout del repository del documento (default: $(Build.SourcesDirectory))
#   templatesDirectory  → checkout del repo dei template (default: $(Pipeline.Workspace)/pipeline-templates)
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: mode
    type: string
    default: 'enforce'
    values: ['off', 'warn', 'enforce']

  - name: provider
    type: string
    default: 'foundry'
    values: ['foundry', 'anthropic']

  - name: serviceConnection
    type: string
    default: ''

  - name: endpoint
    type: string
    default: ''

  - name: model
    type: string
    default: ''

  - name: reasoningEffort
    type: string
    default: 'high'

  - name: anthropicApiKey
    type: string
    default: '$(anthropicApiKey)'

  - name: maxDrafts
    type: number
    default: 3

  - name: sourceRepositories
    type: string

  - name: sourcesDirectory
    type: string
    default: '$(Pipeline.Workspace)/sources'

  - name: correctionsFile
    type: string
    default: '$(Agent.TempDirectory)/c4-corrections.md'

  - name: fragmentDirectory
    type: string
    default: '$(Agent.TempDirectory)/c4-fragments'

  - name: generatedDirectory
    type: string
    default: 'docs/architecture/c4/generated'

  - name: guide
    type: string
    default: 'docs/STYLE.md'

  - name: context
    type: object
    default: ['docs/decisions']

  - name: reviewEvidence
    type: object
    default: []

  - name: maxWords
    type: number
    default: 0

  - name: abbreviations
    type: object
    default: []

  - name: progressBranch
    type: string
    default: ''

  - name: workingDirectory
    type: string
    default: '$(Build.SourcesDirectory)'

  - name: templatesDirectory
    type: string
    default: '$(Pipeline.Workspace)/pipeline-templates'

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - ${{ if and(ne(parameters.mode, 'off'), eq(parameters.provider, 'foundry')) }}:
    - template: ensure-azure-cli.yaml

    - task: AzureCLI@2
      displayName: 'C4 model text (${{ parameters.mode }})'
      inputs:
        azureSubscription: ${{ parameters.serviceConnection }}
        scriptType: pscore
        scriptLocation: scriptPath
        scriptPath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/C4/Write-C4ModelText.ps1'
        workingDirectory: '${{ parameters.workingDirectory }}'
      env:
        GATE_MODE: ${{ parameters.mode }}
        SOURCE_REPOSITORIES: ${{ parameters.sourceRepositories }}
        SOURCES_DIRECTORY: ${{ parameters.sourcesDirectory }}
        C4_CORRECTIONS_FILE: ${{ parameters.correctionsFile }}
        FRAGMENT_DIRECTORY: ${{ parameters.fragmentDirectory }}
        GENERATED_DIRECTORY: ${{ parameters.generatedDirectory }}
        STYLE_GUIDE: ${{ parameters.guide }}
        C4_TEXT_CONTEXT: ${{ join(';', parameters.context) }}
        C4_REVIEW_EVIDENCE: ${{ join(';', parameters.reviewEvidence) }}
        C4_TEXT_ENDPOINT: ${{ parameters.endpoint }}
        C4_TEXT_MODEL: ${{ parameters.model }}
        C4_TEXT_REASONING_EFFORT: ${{ parameters.reasoningEffort }}
        C4_TEXT_MAX_DRAFTS: ${{ parameters.maxDrafts }}
        READABILITY_MAX_WORDS: ${{ parameters.maxWords }}
        READABILITY_ABBREVIATIONS: ${{ join(';', parameters.abbreviations) }}
        PROGRESS_BRANCH: ${{ parameters.progressBranch }}
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        C4_TEXT_PROVIDER: ${{ parameters.provider }}

  - ${{ if and(ne(parameters.mode, 'off'), eq(parameters.provider, 'anthropic')) }}:
    - task: PowerShell@2
      displayName: 'C4 model text (${{ parameters.mode }})'
      inputs:
        filePath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/C4/Write-C4ModelText.ps1'
        workingDirectory: '${{ parameters.workingDirectory }}'
        pwsh: true
      env:
        GATE_MODE: ${{ parameters.mode }}
        SOURCE_REPOSITORIES: ${{ parameters.sourceRepositories }}
        SOURCES_DIRECTORY: ${{ parameters.sourcesDirectory }}
        C4_CORRECTIONS_FILE: ${{ parameters.correctionsFile }}
        FRAGMENT_DIRECTORY: ${{ parameters.fragmentDirectory }}
        GENERATED_DIRECTORY: ${{ parameters.generatedDirectory }}
        STYLE_GUIDE: ${{ parameters.guide }}
        C4_TEXT_CONTEXT: ${{ join(';', parameters.context) }}
        C4_REVIEW_EVIDENCE: ${{ join(';', parameters.reviewEvidence) }}
        C4_TEXT_ENDPOINT: ${{ parameters.endpoint }}
        C4_TEXT_MODEL: ${{ parameters.model }}
        C4_TEXT_REASONING_EFFORT: ${{ parameters.reasoningEffort }}
        C4_TEXT_MAX_DRAFTS: ${{ parameters.maxDrafts }}
        READABILITY_MAX_WORDS: ${{ parameters.maxWords }}
        READABILITY_ABBREVIATIONS: ${{ join(';', parameters.abbreviations) }}
        PROGRESS_BRANCH: ${{ parameters.progressBranch }}
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        C4_TEXT_PROVIDER: ${{ parameters.provider }}
        ANTHROPIC_API_KEY: ${{ parameters.anthropicApiKey }}
