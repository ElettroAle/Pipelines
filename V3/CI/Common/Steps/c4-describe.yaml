# ── CI Step: C4 model text ────────────────────────────────────────────────────
#
# Testo della parte del modello C4 che nasce da un repository sorgente (V3/CI/Scripts/Write-C4ModelText.ps1):
# la descrizione di ogni elemento, cio' che passa su ogni relazione, le persone e i sistemi esterni con
# le loro relazioni, scritti da un modello Azure OpenAI leggendo i frammenti dei lettori (c4-read-*.yaml),
# il codice degli elementi, la guida di stile e i documenti di contesto. Ogni stesura passa controlli
# deterministici e, se li fallisce, torna al modello con i motivi; oltre maxDrafts stesure la pipeline
# fallisce. Il testo accettato si salva in generatedDirectory e, con progressBranch, sul ramo, un
# container alla volta: rilanciata, la pipeline riparte dai container senza testo accettato. Il testo di
# un container la cui struttura non cambia resta quello accettato. Lo compone c4-generate.yaml, da
# eseguire dopo questo step. L'accesso al modello passa dalla service connection con un token Entra ID,
# senza chiavi; con progressBranch l'identita' della build deve poter contribuire al repository e creare
# rami.
#
# Riusato da:
#   il consumer, nella pipeline della documentazione che rigenera la parte di un repository sorgente
#   dopo la sua integrazione, fra i passi di lettura delle sue tecnologie e c4-generate.yaml
#
# Parametri
# ─────────
#   mode                → 'off' | 'warn' (segnala senza bloccare) | 'enforce' (default)
#   serviceConnection   → service connection Azure con il ruolo Cognitive Services OpenAI User [REQUIRED se mode non e' off]
#   endpoint            → endpoint della risorsa Azure OpenAI, es. https://<nome>.openai.azure.com [REQUIRED se mode non e' off]
#   model               → nome del deployment del modello [REQUIRED se mode non e' off]
#   reasoningEffort     → ragionamento del modello (default: high)
#   maxDrafts           → stesure massime per container (default: 3)
#   sourceRepository    → nome del repository sorgente, es. $(Build.Repository.Name)
#   sourceDirectory     → checkout del repository sorgente (default: $(Build.SourcesDirectory))
#   fragmentDirectory   → cartella dei frammenti dei lettori (default: $(Agent.TempDirectory)/c4-fragments)
#   generatedDirectory  → cartella delle parti generate, relativa a workingDirectory (default: docs/architecture/model/generated)
#   guide               → guida di stile del documento (default: docs/STYLE.md)
#   context             → file o cartelle di contesto del documento, Markdown (default: [docs/decisions])
#   maxWords            → parole massime di una frase del testo, 0 senza limite (default: 0)
#   abbreviations       → abbreviazioni con il punto che non chiudono una frase (default: nessuna)
#   progressBranch      → ramo del repository del documento che porta il testo accettato (default: nessuno)
#   workingDirectory    → checkout del repository del documento (default: $(Build.SourcesDirectory))
#   templatesDirectory  → checkout del repo dei template (default: $(Pipeline.Workspace)/pipeline-templates)
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: mode
    type: string
    default: 'enforce'
    values: ['off', 'warn', 'enforce']

  - name: serviceConnection
    type: string
    default: ''

  - name: endpoint
    type: string
    default: ''

  - name: model
    type: string
    default: ''

  - name: reasoningEffort
    type: string
    default: 'high'

  - name: maxDrafts
    type: number
    default: 3

  - name: sourceRepository
    type: string
    default: '$(Build.Repository.Name)'

  - name: sourceDirectory
    type: string
    default: '$(Build.SourcesDirectory)'

  - name: fragmentDirectory
    type: string
    default: '$(Agent.TempDirectory)/c4-fragments'

  - name: generatedDirectory
    type: string
    default: 'docs/architecture/model/generated'

  - name: guide
    type: string
    default: 'docs/STYLE.md'

  - name: context
    type: object
    default: ['docs/decisions']

  - name: maxWords
    type: number
    default: 0

  - name: abbreviations
    type: object
    default: []

  - name: progressBranch
    type: string
    default: ''

  - name: workingDirectory
    type: string
    default: '$(Build.SourcesDirectory)'

  - name: templatesDirectory
    type: string
    default: '$(Pipeline.Workspace)/pipeline-templates'

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - ${{ if ne(parameters.mode, 'off') }}:
    - template: ensure-azure-cli.yaml

    - task: AzureCLI@2
      displayName: 'C4 model text of ${{ parameters.sourceRepository }} (${{ parameters.mode }})'
      inputs:
        azureSubscription: ${{ parameters.serviceConnection }}
        scriptType: pscore
        scriptLocation: scriptPath
        scriptPath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/Write-C4ModelText.ps1'
        workingDirectory: '${{ parameters.workingDirectory }}'
      env:
        GATE_MODE: ${{ parameters.mode }}
        SOURCE_REPOSITORY: ${{ parameters.sourceRepository }}
        SOURCE_DIRECTORY: ${{ parameters.sourceDirectory }}
        FRAGMENT_DIRECTORY: ${{ parameters.fragmentDirectory }}
        GENERATED_DIRECTORY: ${{ parameters.generatedDirectory }}
        STYLE_GUIDE: ${{ parameters.guide }}
        C4_TEXT_CONTEXT: ${{ join(';', parameters.context) }}
        C4_TEXT_ENDPOINT: ${{ parameters.endpoint }}
        C4_TEXT_MODEL: ${{ parameters.model }}
        C4_TEXT_REASONING_EFFORT: ${{ parameters.reasoningEffort }}
        C4_TEXT_MAX_DRAFTS: ${{ parameters.maxDrafts }}
        READABILITY_MAX_WORDS: ${{ parameters.maxWords }}
        READABILITY_ABBREVIATIONS: ${{ join(';', parameters.abbreviations) }}
        PROGRESS_BRANCH: ${{ parameters.progressBranch }}
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
