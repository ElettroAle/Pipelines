# ── CI Step: Document language ────────────────────────────────────────────────
#
# Dichiara la lingua del documento per gli step che seguono nel job: DOCUMENT_LANGUAGE sceglie
# V3/CI/Scripts/Languages/<lingua>.psd1, con le convenzioni che dipendono dalla lingua (marcatore
# di vista, tag dei container, sezioni degli ADR). Vale anche per gli step che il consumer
# inietta, come c4-verify.yaml, che cosi' non chiedono la lingua una seconda volta.
#
# Riusato da:
#   CI/Agnostic/quality-arc42.yaml
#   CI/Agnostic/quality-docs.yaml
#
# Parametri
# ─────────
#   language → lingua del documento, es. 'IT' o 'EN' (default: IT)
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: language
    type: string
    default: 'IT'

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - pwsh: Write-Host "##vso[task.setvariable variable=DOCUMENT_LANGUAGE]${{ parameters.language }}"
    displayName: 'Document language ${{ parameters.language }}'
