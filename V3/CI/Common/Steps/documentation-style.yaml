# ── CI Step: Documentation style ──────────────────────────────────────────────
#
# Giudica lo stile delle sezioni di un documento con un modello Azure OpenAI
# (V3/CI/Scripts/Test-DocumentationStyle.ps1): la guida di stile del repository e'
# l'istruzione del modello. L'accesso al modello passa dalla service connection con un
# token Entra ID, senza chiavi. In modalita' fix le correzioni del modello, validate e
# rigiudicate, si salvano un file alla volta su un ramo di appoggio e tornano sul ramo della
# PR a fine giudizio con i commit dell'identita' della build, che deve poter contribuire al
# repository, creare rami e, per togliere il ramo di appoggio, cancellarli.
#
# Riusato da:
#   CI/Agnostic/quality-docs.yaml
#   CI/Agnostic/quality-arc42.yaml
#
# Parametri
# ─────────
#   mode               → 'off' (default) | 'warn' (segnala senza bloccare) | 'enforce' |
#                        'fix' (corregge in una PR, poi blocca come enforce se restano violazioni oltre maxFindings)
#   docsDirectory      → cartella delle sezioni del documento (default: docs/architecture)
#   guide              → guida di stile del repository, istruzione del modello (default: docs/STYLE.md)
#   glossary           → file del glossario in docsDirectory, contesto del giudizio e non giudicato (default: nessuno)
#   serviceConnection  → service connection Azure con il ruolo Cognitive Services OpenAI User [REQUIRED se mode non e' off]
#   endpoint           → endpoint della risorsa Azure OpenAI, es. https://<nome>.openai.azure.com [REQUIRED se mode non e' off]
#   model              → nome del deployment del modello [REQUIRED se mode non e' off]
#   gulpease, maxWords, abbreviations, decisionsDirectory → soglie dei controlli oggettivi, rieseguiti sul
#                        testo corretto prima di pubblicarlo (come in documentation-verify.yaml)
#   maxRounds          → giri massimi di giudizio in modalita' fix, l'ultimo solo di verifica (default: 4)
#   maxFindings        → violazioni che restano come avvisi senza bloccare: 0 blocca ogni violazione, -1 nessun
#                        limite (default: 0). Oltre la soglia, in modalita' fix le correzioni si pubblicano
#                        comunque e il giudizio dopo verifica solo le unita' rimaste in sospeso, senza correggerle
#   decisionsExcludedRules → titoli delle regole della guida che non valgono per le decisioni: il modello non le
#                        riceve quando giudica una decisione (default: nessuna)
#   seed               → seme del modello, per giudizi ripetibili (default: 1)
#   templatesDirectory → checkout del repo dei template (default: $(Pipeline.Workspace)/pipeline-templates)
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: mode
    type: string
    default: 'off'
    values: ['off', 'warn', 'enforce', 'fix']

  - name: docsDirectory
    type: string
    default: 'docs/architecture'

  - name: guide
    type: string
    default: 'docs/STYLE.md'

  - name: glossary
    type: string
    default: ''

  - name: serviceConnection
    type: string
    default: ''

  - name: endpoint
    type: string
    default: ''

  - name: model
    type: string
    default: ''

  - name: gulpease
    type: number
    default: 0

  - name: maxWords
    type: number
    default: 0

  - name: abbreviations
    type: object
    default: []

  - name: decisionsDirectory
    type: string
    default: 'docs/decisions'

  - name: maxRounds
    type: number
    default: 4

  - name: maxFindings
    type: number
    default: 0

  - name: decisionsExcludedRules
    type: object
    default: []

  - name: seed
    type: number
    default: 1

  - name: templatesDirectory
    type: string
    default: '$(Pipeline.Workspace)/pipeline-templates'

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - ${{ if ne(parameters.mode, 'off') }}:
    - template: ensure-azure-cli.yaml

    - task: AzureCLI@2
      displayName: 'Documentation style ${{ parameters.docsDirectory }} (${{ parameters.mode }})'
      inputs:
        azureSubscription: ${{ parameters.serviceConnection }}
        scriptType: pscore
        scriptLocation: scriptPath
        scriptPath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/Test-DocumentationStyle.ps1'
        workingDirectory: '$(Build.SourcesDirectory)'
      env:
        GATE_MODE: ${{ replace(parameters.mode, 'fix', 'enforce') }}
        STYLE_FIX: ${{ eq(parameters.mode, 'fix') }}
        STYLE_MAX_ROUNDS: ${{ parameters.maxRounds }}
        STYLE_MAX_FINDINGS: ${{ parameters.maxFindings }}
        STYLE_DECISIONS_EXCLUDED_RULES: ${{ join(';', parameters.decisionsExcludedRules) }}
        STYLE_JUDGE_SEED: ${{ parameters.seed }}
        DOCS_DIRECTORY: ${{ parameters.docsDirectory }}
        STYLE_GUIDE: ${{ parameters.guide }}
        DOCS_GLOSSARY: ${{ parameters.glossary }}
        TARGET_BRANCH: $(System.PullRequest.TargetBranch)
        SOURCE_BRANCH: $(System.PullRequest.SourceBranch)
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        READABILITY_GULPEASE: ${{ parameters.gulpease }}
        READABILITY_MAX_WORDS: ${{ parameters.maxWords }}
        READABILITY_ABBREVIATIONS: ${{ join(';', parameters.abbreviations) }}
        DECISIONS_DIRECTORY: ${{ parameters.decisionsDirectory }}
        STYLE_JUDGE_ENDPOINT: ${{ parameters.endpoint }}
        STYLE_JUDGE_MODEL: ${{ parameters.model }}
