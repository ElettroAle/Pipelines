# ── CI Step: C4 read Terraform ────────────────────────────────────────────────
#
# Lettore Terraform del modello C4 generato (V3/CI/Scripts/C4/Read-C4TerraformModel.ps1), eseguito da
# c4-read.yaml dopo i lettori dei container: legge la dichiarazione Terraform del checkout del
# repository sorgente, ambiente per ambiente, senza eseguire Terraform e senza leggere lo stato, e
# scrive in fragmentDirectory gli ambienti di deployment con i nodi annidati (sottoscrizione, gruppo di
# risorse, rete virtuale, subnet, piano di hosting) e le istanze dei container dei frammenti gia'
# scritti. Una risorsa di hosting di un tipo che le regole non riconoscono ferma la lettura.
#
# Riusato da:
#   il consumer, prima di c4-generate.yaml, per un repository sorgente con la dichiarazione Terraform
#
# Parametri
# ─────────
#   environments       → ambienti del modello e directory d'ambiente dei moduli radice, es.
#                        'dev=dev-x;prod=prod-x' [REQUIRED]
#   instances          → moduli radice istanziati una volta per directory, es.
#                        'Customers:customer_id=environments/{environment}/data/*' (default: nessuno)
#   mode               → 'off' | 'warn' (segnala senza bloccare) | 'enforce' (default)
#   sourceRepository   → nome del repository sorgente, es. $(Build.Repository.Name)
#   sourceDirectory    → checkout del repository sorgente (default: $(Build.SourcesDirectory))
#   fragmentDirectory  → cartella dei frammenti (default: $(Agent.TempDirectory)/c4-fragments)
#   templatesDirectory → checkout del repo dei template (default: $(Pipeline.Workspace)/pipeline-templates)
#   condition          → condizione del passo, es. per saltarlo quando manca un file (default: succeeded())
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: environments
    type: string

  - name: instances
    type: string
    default: ''

  - name: mode
    type: string
    default: 'enforce'
    values: ['off', 'warn', 'enforce']

  - name: sourceRepository
    type: string
    default: '$(Build.Repository.Name)'

  - name: sourceDirectory
    type: string
    default: '$(Build.SourcesDirectory)'

  - name: fragmentDirectory
    type: string
    default: '$(Agent.TempDirectory)/c4-fragments'

  - name: templatesDirectory
    type: string
    default: '$(Pipeline.Workspace)/pipeline-templates'

  - name: condition
    type: string
    default: 'succeeded()'

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - template: c4-read.yaml
    parameters:
      scriptPath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/C4/Read-C4TerraformModel.ps1'
      displayName: 'C4 Terraform deployment'
      mode: ${{ parameters.mode }}
      sourceRepository: ${{ parameters.sourceRepository }}
      sourceDirectory: ${{ parameters.sourceDirectory }}
      fragmentDirectory: ${{ parameters.fragmentDirectory }}
      templatesDirectory: ${{ parameters.templatesDirectory }}
      condition: ${{ parameters.condition }}
      environment:
        C4_DEPLOYMENT_ENVIRONMENTS: ${{ parameters.environments }}
        C4_TERRAFORM_INSTANCES: ${{ parameters.instances }}
