# ── CI Step: Aggiornamento della documentazione ──────────────────────────────
#
# Dopo un cambiamento arrivato nel ramo principale, un modello linguistico riscrive i documenti che il
# cambiamento tocca (V3/CI/Scripts/Documentation/Update-Documentation.ps1) e una PR in auto-complete li
# porta nel ramo principale. Il cambiamento sono i commit, dal punto di partenza registrato in baselineFile,
# che toccano changePaths; i commit degli aggiornamenti precedenti restano fuori. Le verifiche indicate
# giudicano ogni stesura, e una stesura che porta rilievi nuovi torna al modello con i motivi, fino a
# maxDrafts stesure. Esiti:
#   - stesura accettata: i documenti e il punto di partenza vanno nella PR dal ramo branch;
#   - stesure tutte scartate: i documenti non cambiano, si apre un work item di tipo workItemType con il
#     cambiamento e i motivi, e il punto di partenza avanza;
#   - modello non disponibile: nulla cambia e nessun work item, la run successiva riprende dallo stesso punto;
#   - nessun cambiamento: nessuna chiamata al modello e nessuna PR.
# Senza punto di partenza il passo lo registra senza chiamare il modello. Una decisione che il modello cambia
# riceve la versione successiva e la voce che nomina l'origine, cioe' l'ultimo commit di originDirectory.
# Con provider foundry l'accesso al modello passa dalla service connection con un token Entra ID
# (AzureCLI@2); con provider anthropic il passo e' un PowerShell@2 senza service connection e la chiave e'
# una variabile segreta del consumer, mappata in ANTHROPIC_API_KEY.
# Il checkout deve portare tutta la storia (fetchDepth: 0). L'identita' della build deve contribuire al
# repository, creare rami, contribuire alle PR e creare work item. La lingua delle voci delle versioni
# segue DOCUMENT_LANGUAGE (document-language.yaml). Le verifiche dei diagrammi richiedono Java 17 e Node.js.
#
# Riusato da:
#   il consumer, nel job che segue l'integrazione nel ramo principale
#
# Parametri
# ─────────
#   provider           → fornitore del modello: 'foundry' (default) | 'anthropic'
#   serviceConnection  → service connection Azure con il ruolo Cognitive Services OpenAI User [REQUIRED con foundry]
#   endpoint           → endpoint della risorsa Azure OpenAI [REQUIRED con foundry]; con anthropic vuoto vuol
#                        dire https://api.anthropic.com
#   model              → deployment Foundry o modello Anthropic [REQUIRED]
#   anthropicApiKey    → chiave dell'API Anthropic, con anthropic (default: $(anthropicApiKey), la variabile
#                        segreta del consumer)
#   reasoningEffort    → ragionamento del modello (default: high)
#   maxDrafts          → stesure massime, la prima e le correzioni (default: 3)
#   guide              → guida di stile del documento (default: docs/STYLE.md)
#   docsDirectory      → cartella delle sezioni del documento (default: docs/architecture)
#   decisionsDirectory → cartella degli ADR (default: docs/decisions)
#   guides             → altri file Markdown che l'aggiornamento puo' riscrivere (default: nessuno)
#   changePaths        → cartelle o file il cui cambiamento si documenta (default: decisionsDirectory e
#                        <docsDirectory>/c4/generated)
#   baselineFile       → file con l'ultimo commit documentato (default: .documentation-baseline)
#   verifications      → script di verifica, relativi a V3/CI/Scripts (default: corpus degli ADR, arc42,
#                        documentazione, diagrammi Mermaid e flussi)
#   language           → lingua del template arc42, per Test-Arc42Document.ps1 [REQUIRED con quella verifica]
#   gulpease           → indice Gulpease minimo del testo di ogni sezione (default: 0, nessuna soglia)
#   maxWords           → parole massime per frase (default: 0, nessuna soglia)
#   abbreviations      → abbreviazioni che non chiudono una frase (default: nessuna)
#   originDirectory    → checkout del repository che ha causato il cambiamento (default: il repository
#                        della documentazione)
#   workItemType       → tipo del work item di un aggiornamento respinto (default: Bug)
#   branch             → ramo della PR (default: documentation/update)
#   title              → titolo della PR (default: docs: documentation updated after the integration)
#   targetBranch       → ramo principale (default: main)
#   nodeVersion        → versione di Node.js per il parser Mermaid (default: 22.x)
#   templatesDirectory → checkout del repo dei template (default: $(Pipeline.Workspace)/pipeline-templates)
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: provider
    type: string
    default: 'foundry'
    values: ['foundry', 'anthropic']

  - name: serviceConnection
    type: string
    default: ''

  - name: endpoint
    type: string
    default: ''

  - name: model
    type: string
    default: ''

  - name: anthropicApiKey
    type: string
    default: '$(anthropicApiKey)'

  - name: reasoningEffort
    type: string
    default: 'high'

  - name: maxDrafts
    type: number
    default: 3

  - name: guide
    type: string
    default: 'docs/STYLE.md'

  - name: docsDirectory
    type: string
    default: 'docs/architecture'

  - name: decisionsDirectory
    type: string
    default: 'docs/decisions'

  - name: guides
    type: object
    default: []

  - name: changePaths
    type: object
    default: []

  - name: baselineFile
    type: string
    default: '.documentation-baseline'

  - name: verifications
    type: object
    default:
      - 'Adr/Test-AdrCorpus.ps1'
      - 'Arc42/Test-Arc42Document.ps1'
      - 'Documentation/Test-Documentation.ps1'
      - 'Mermaid/Test-MermaidDiagrams.ps1'
      - 'Mermaid/Test-DiagramFlows.ps1'

  - name: language
    type: string
    default: ''

  - name: gulpease
    type: number
    default: 0

  - name: maxWords
    type: number
    default: 0

  - name: abbreviations
    type: object
    default: []

  - name: originDirectory
    type: string
    default: ''

  - name: workItemType
    type: string
    default: 'Bug'

  - name: branch
    type: string
    default: 'documentation/update'

  - name: title
    type: string
    default: 'docs: documentation updated after the integration'

  - name: targetBranch
    type: string
    default: 'main'

  - name: nodeVersion
    type: string
    default: '22.x'

  - name: templatesDirectory
    type: string
    default: '$(Pipeline.Workspace)/pipeline-templates'

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - template: ensure-java.yaml

  - task: UseNode@1
    displayName: 'Install Node.js'
    inputs:
      version: ${{ parameters.nodeVersion }}

  - ${{ if eq(parameters.provider, 'foundry') }}:
    - template: ensure-azure-cli.yaml

    - task: AzureCLI@2
      displayName: 'Documentation updated with the change'
      inputs:
        azureSubscription: ${{ parameters.serviceConnection }}
        scriptType: pscore
        scriptLocation: scriptPath
        scriptPath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/Documentation/Update-Documentation.ps1'
        workingDirectory: '$(Build.SourcesDirectory)'
      env:
        DOCS_DIRECTORY: ${{ parameters.docsDirectory }}
        DECISIONS_DIRECTORY: ${{ parameters.decisionsDirectory }}
        DOCS_UPDATE_GUIDES: ${{ join(';', parameters.guides) }}
        DOCS_UPDATE_CHANGE_PATHS: ${{ join(';', parameters.changePaths) }}
        DOCS_UPDATE_BASELINE: ${{ parameters.baselineFile }}
        DOCS_UPDATE_VERIFICATIONS: ${{ join(';', parameters.verifications) }}
        DOCS_UPDATE_MAX_DRAFTS: ${{ parameters.maxDrafts }}
        DOCS_UPDATE_ORIGIN_DIRECTORY: ${{ parameters.originDirectory }}
        DOCS_UPDATE_DESCRIPTION_FILE: '$(Agent.TempDirectory)/documentation-update.md'
        DOCS_UPDATE_WORK_ITEM_TYPE: ${{ parameters.workItemType }}
        DOCS_UPDATE_PROVIDER: ${{ parameters.provider }}
        DOCS_UPDATE_ENDPOINT: ${{ parameters.endpoint }}
        DOCS_UPDATE_MODEL: ${{ parameters.model }}
        DOCS_UPDATE_REASONING_EFFORT: ${{ parameters.reasoningEffort }}
        STYLE_GUIDE: ${{ parameters.guide }}
        ARC42_LANGUAGE: ${{ parameters.language }}
        READABILITY_GULPEASE: ${{ parameters.gulpease }}
        READABILITY_MAX_WORDS: ${{ parameters.maxWords }}
        READABILITY_ABBREVIATIONS: ${{ join(';', parameters.abbreviations) }}
        TARGET_BRANCH: ${{ parameters.targetBranch }}
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - ${{ if eq(parameters.provider, 'anthropic') }}:
    - task: PowerShell@2
      displayName: 'Documentation updated with the change'
      inputs:
        filePath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/Documentation/Update-Documentation.ps1'
        workingDirectory: '$(Build.SourcesDirectory)'
        pwsh: true
      env:
        DOCS_DIRECTORY: ${{ parameters.docsDirectory }}
        DECISIONS_DIRECTORY: ${{ parameters.decisionsDirectory }}
        DOCS_UPDATE_GUIDES: ${{ join(';', parameters.guides) }}
        DOCS_UPDATE_CHANGE_PATHS: ${{ join(';', parameters.changePaths) }}
        DOCS_UPDATE_BASELINE: ${{ parameters.baselineFile }}
        DOCS_UPDATE_VERIFICATIONS: ${{ join(';', parameters.verifications) }}
        DOCS_UPDATE_MAX_DRAFTS: ${{ parameters.maxDrafts }}
        DOCS_UPDATE_ORIGIN_DIRECTORY: ${{ parameters.originDirectory }}
        DOCS_UPDATE_DESCRIPTION_FILE: '$(Agent.TempDirectory)/documentation-update.md'
        DOCS_UPDATE_WORK_ITEM_TYPE: ${{ parameters.workItemType }}
        DOCS_UPDATE_PROVIDER: ${{ parameters.provider }}
        DOCS_UPDATE_ENDPOINT: ${{ parameters.endpoint }}
        DOCS_UPDATE_MODEL: ${{ parameters.model }}
        DOCS_UPDATE_REASONING_EFFORT: ${{ parameters.reasoningEffort }}
        ANTHROPIC_API_KEY: ${{ parameters.anthropicApiKey }}
        STYLE_GUIDE: ${{ parameters.guide }}
        ARC42_LANGUAGE: ${{ parameters.language }}
        READABILITY_GULPEASE: ${{ parameters.gulpease }}
        READABILITY_MAX_WORDS: ${{ parameters.maxWords }}
        READABILITY_ABBREVIATIONS: ${{ join(';', parameters.abbreviations) }}
        TARGET_BRANCH: ${{ parameters.targetBranch }}
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - template: azureRepos-pull-request.yaml
    parameters:
      paths:
        - ${{ parameters.docsDirectory }}
        - ${{ parameters.decisionsDirectory }}
        - ${{ parameters.baselineFile }}
        - ${{ each guide in parameters.guides }}:
          - ${{ guide }}
      branch: ${{ parameters.branch }}
      title: ${{ parameters.title }}
      descriptionFile: '$(Agent.TempDirectory)/documentation-update.md'
      originDirectory: ${{ parameters.originDirectory }}
      targetBranch: ${{ parameters.targetBranch }}
      templatesDirectory: ${{ parameters.templatesDirectory }}
      condition: and(succeeded(), eq(variables['documentationUpdateChanged'], 'True'))
