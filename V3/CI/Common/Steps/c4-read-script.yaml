# ── CI Step: C4 read with a consumer script ───────────────────────────────────
#
# Lettore del modello C4 generato scritto nel repository del consumer, per una tecnologia o una
# convenzione che questo repository non conosce. Lo script legge il checkout del repository
# sorgente e scrive in fragmentDirectory un frammento con il contratto di
# V3/CI/Scripts/C4CodeModel.ps1, che c4-generate.yaml unisce agli altri. Trova gli script comuni
# (C4CodeModel.ps1, VerificationGate.ps1, DocumentLanguage.ps1) in C4_SCRIPTS_DIRECTORY.
#
# Riusato da:
#   il consumer, prima di c4-generate.yaml, per un repository sorgente letto da un suo script
#
# Parametri
# ─────────
#   scriptPath         → script del lettore nel repository del consumer (obbligatorio)
#   displayName        → nome del passo nella pipeline (default: 'C4 read')
#   mode               → 'off' | 'warn' (segnala senza bloccare) | 'enforce' (default)
#   sourceRepository   → nome del repository sorgente, es. $(Build.Repository.Name)
#   sourceDirectory    → checkout del repository sorgente (default: $(Build.SourcesDirectory))
#   fragmentDirectory  → cartella dei frammenti (default: $(Agent.TempDirectory)/c4-fragments)
#   workingDirectory   → cartella in cui gira lo script (default: $(Build.SourcesDirectory))
#   templatesDirectory → checkout del repo dei template (default: $(Pipeline.Workspace)/pipeline-templates)
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: scriptPath
    type: string

  - name: displayName
    type: string
    default: 'C4 read'

  - name: mode
    type: string
    default: 'enforce'
    values: ['off', 'warn', 'enforce']

  - name: sourceRepository
    type: string
    default: '$(Build.Repository.Name)'

  - name: sourceDirectory
    type: string
    default: '$(Build.SourcesDirectory)'

  - name: fragmentDirectory
    type: string
    default: '$(Agent.TempDirectory)/c4-fragments'

  - name: workingDirectory
    type: string
    default: '$(Build.SourcesDirectory)'

  - name: templatesDirectory
    type: string
    default: '$(Pipeline.Workspace)/pipeline-templates'

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - task: PowerShell@2
    displayName: '${{ parameters.displayName }} of ${{ parameters.sourceRepository }} (${{ parameters.mode }})'
    inputs:
      filePath: '${{ parameters.scriptPath }}'
      workingDirectory: '${{ parameters.workingDirectory }}'
      pwsh: true
    env:
      GATE_MODE: ${{ parameters.mode }}
      SOURCE_REPOSITORY: ${{ parameters.sourceRepository }}
      SOURCE_DIRECTORY: ${{ parameters.sourceDirectory }}
      FRAGMENT_DIRECTORY: ${{ parameters.fragmentDirectory }}
      C4_SCRIPTS_DIRECTORY: ${{ parameters.templatesDirectory }}/V3/CI/Scripts
