# ── CI Step: C4 generation ────────────────────────────────────────────────────
#
# Parte del modello C4 che nasce da un repository sorgente (V3/CI/Scripts/C4/Export-C4CodeModel.ps1):
# un file Structurizr DSL per repository in generatedDirectory, scritto dai frammenti che i passi di
# lettura delle tecnologie (c4-read-*.yaml) hanno lasciato in fragmentDirectory. Non conosce le
# tecnologie: un file di progetto del repository che nessun lettore ha letto ferma la generazione.
# Compone il testo che c4-describe.yaml ha scritto per il repository e scrive context.dsl, le persone e
# i sistemi esterni dei testi di tutti i repository, da includere nel modello prima del sistema.
# Con generationMode 'check' i file del documento si confrontano con quelli che la generazione produce.
# Tag e proprieta' seguono DOCUMENT_LANGUAGE (document-language.yaml).
#
# Riusato da:
#   il consumer, nella pipeline della documentazione che rigenera la parte di un repository sorgente
#   dopo la sua integrazione o la verifica sulle PR, dopo i passi di lettura delle sue tecnologie
#
# Parametri
# ─────────
#   mode               → 'off' | 'warn' (segnala senza bloccare) | 'enforce' (default)
#   generationMode     → 'write' (default, scrive il file) | 'check' (confronta senza scrivere)
#   sourceRepository   → nome del repository sorgente, es. $(Build.Repository.Name)
#   sourceDirectory    → checkout del repository sorgente (default: $(Build.SourcesDirectory))
#   sourceRepositories → repository sorgente del documento separati da virgola, per il nome del
#                        gruppo senza il loro prefisso comune
#   fragmentDirectory  → cartella dei frammenti dei lettori (default: $(Agent.TempDirectory)/c4-fragments)
#   generatedDirectory → cartella delle parti generate (default: docs/architecture/model/generated)
#   workingDirectory   → checkout del repository del documento (default: $(Build.SourcesDirectory))
#   templatesDirectory → checkout del repo dei template (default: $(Pipeline.Workspace)/pipeline-templates)
#   condition          → condizione del passo, es. per saltarlo quando manca un file (default: succeeded())
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: mode
    type: string
    default: 'enforce'
    values: ['off', 'warn', 'enforce']

  - name: generationMode
    type: string
    default: 'write'
    values: ['write', 'check']

  - name: sourceRepository
    type: string
    default: '$(Build.Repository.Name)'

  - name: sourceDirectory
    type: string
    default: '$(Build.SourcesDirectory)'

  - name: sourceRepositories
    type: string
    default: ''

  - name: fragmentDirectory
    type: string
    default: '$(Agent.TempDirectory)/c4-fragments'

  - name: generatedDirectory
    type: string
    default: ''

  - name: workingDirectory
    type: string
    default: '$(Build.SourcesDirectory)'

  - name: templatesDirectory
    type: string
    default: '$(Pipeline.Workspace)/pipeline-templates'

  - name: condition
    type: string
    default: 'succeeded()'

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - task: PowerShell@2
    displayName: 'C4 model from ${{ parameters.sourceRepository }} (${{ parameters.generationMode }}, ${{ parameters.mode }})'
    inputs:
      filePath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/C4/Export-C4CodeModel.ps1'
      workingDirectory: '${{ parameters.workingDirectory }}'
      pwsh: true
    condition: ${{ parameters.condition }}
    env:
      GATE_MODE: ${{ parameters.mode }}
      GENERATION_MODE: ${{ parameters.generationMode }}
      SOURCE_REPOSITORY: ${{ parameters.sourceRepository }}
      SOURCE_DIRECTORY: ${{ parameters.sourceDirectory }}
      FRAGMENT_DIRECTORY: ${{ parameters.fragmentDirectory }}
      ${{ if ne(parameters.sourceRepositories, '') }}:
        SOURCE_REPOSITORIES: ${{ parameters.sourceRepositories }}
      ${{ if ne(parameters.generatedDirectory, '') }}:
        GENERATED_DIRECTORY: ${{ parameters.generatedDirectory }}
