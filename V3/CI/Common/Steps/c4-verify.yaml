# ── CI Step: C4 ───────────────────────────────────────────────────────────────
#
# Modello C4 di un documento in Structurizr DSL (V3/CI/Scripts/Test-C4Model.ps1):
# model/workspace.dsl nella cartella del documento, viste di contesto, dei container e di
# deployment, componenti dei container con il tag delle applicazioni, marcatori di vista nelle
# sezioni. Tag e marcatore seguono DOCUMENT_LANGUAGE (document-language.yaml): in italiano
# Applicazione e <!-- vista: chiave -->. La Structurizr CLI richiede Java 17.
#
# Riusato da:
#   il consumer, nel parametro diagramSteps di CI/Agnostic/quality-arc42.yaml e
#   CI/Agnostic/quality-docs.yaml
#
# Parametri
# ─────────
#   mode               → 'off' | 'warn' (segnala senza bloccare) | 'enforce' (default)
#   docsDirectory      → cartella delle sezioni del documento (default: docs/architecture)
#   templatesDirectory → checkout del repo dei template (default: $(Pipeline.Workspace)/pipeline-templates)
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: mode
    type: string
    default: 'enforce'
    values: ['off', 'warn', 'enforce']

  - name: docsDirectory
    type: string
    default: 'docs/architecture'

  - name: templatesDirectory
    type: string
    default: '$(Pipeline.Workspace)/pipeline-templates'

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - ${{ if ne(parameters.mode, 'off') }}:
    - template: ensure-java.yaml

  - task: PowerShell@2
    displayName: 'C4 model ${{ parameters.docsDirectory }} (${{ parameters.mode }})'
    inputs:
      filePath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/Test-C4Model.ps1'
      workingDirectory: '$(Build.SourcesDirectory)'
      pwsh: true
    env:
      GATE_MODE: ${{ parameters.mode }}
      DOCS_DIRECTORY: ${{ parameters.docsDirectory }}
