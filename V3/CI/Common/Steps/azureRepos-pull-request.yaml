# ── CI Step: Azure Repos pull request ─────────────────────────────────────────
#
# Porta su un ramo le cartelle o i file che la pipeline ha scritto nel checkout di un repository Azure
# Repos e apre una PR verso targetBranch (V3/CI/Scripts/AzureRepos/Publish-PullRequest.ps1). Le cartelle
# indicate si sostituiscono per intero con quelle scritte dalla pipeline. Il ramo puo' gia' portare i
# commit di un passo precedente: si riparte da li'. Se il contenuto non differisce da targetBranch non si
# apre nessuna PR; una PR attiva sullo stesso ramo si aggiorna. L'identita' della build deve poter
# contribuire al repository, creare rami e contribuire alle PR; il repository e' quello di origin del
# checkout, nel progetto della pipeline.
#
# Riusato da:
#   il consumer, dopo i passi che scrivono i file da proporre
#
# Parametri
# ─────────
#   paths              → cartelle o file da proporre, relativi a workingDirectory [REQUIRED]
#   branch             → ramo della PR [REQUIRED]
#   title              → titolo della PR e messaggio del commit [REQUIRED]
#   description        → descrizione della PR (default: nessuna)
#   originDirectory    → checkout del repository che ha causato la modifica: la descrizione ne cita
#                        l'ultimo commit, es. "Merged PR 12: ..." (default: nessuno)
#   originLabel        → etichetta della riga che cita quel commit (default: Origin)
#   targetBranch       → ramo di destinazione (default: main)
#   mergeStrategy      → noFastForward (default) | squash | rebase | rebaseMerge
#   autoComplete       → completamento automatico a nome dell'identita' della build (default: true)
#   deleteSourceBranch → cancella il ramo al completamento (default: true)
#   draft              → apre la PR come bozza (default: false)
#   workingDirectory   → checkout del repository della PR (default: $(Build.SourcesDirectory))
#   templatesDirectory → checkout del repo dei template (default: $(Pipeline.Workspace)/pipeline-templates)
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: paths
    type: object

  - name: branch
    type: string

  - name: title
    type: string

  - name: description
    type: string
    default: ''

  - name: originDirectory
    type: string
    default: ''

  - name: originLabel
    type: string
    default: 'Origin'

  - name: targetBranch
    type: string
    default: 'main'

  - name: mergeStrategy
    type: string
    default: 'noFastForward'
    values: ['noFastForward', 'squash', 'rebase', 'rebaseMerge']

  - name: autoComplete
    type: boolean
    default: true

  - name: deleteSourceBranch
    type: boolean
    default: true

  - name: draft
    type: boolean
    default: false

  - name: workingDirectory
    type: string
    default: '$(Build.SourcesDirectory)'

  - name: templatesDirectory
    type: string
    default: '$(Pipeline.Workspace)/pipeline-templates'

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - task: PowerShell@2
    displayName: 'Pull request from ${{ parameters.branch }} to ${{ parameters.targetBranch }}'
    inputs:
      filePath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/AzureRepos/Publish-PullRequest.ps1'
      workingDirectory: '${{ parameters.workingDirectory }}'
      pwsh: true
    env:
      PULL_REQUEST_PATHS: ${{ join(';', parameters.paths) }}
      PULL_REQUEST_BRANCH: ${{ parameters.branch }}
      PULL_REQUEST_TITLE: ${{ parameters.title }}
      PULL_REQUEST_DESCRIPTION: ${{ parameters.description }}
      PULL_REQUEST_ORIGIN_DIRECTORY: ${{ parameters.originDirectory }}
      PULL_REQUEST_ORIGIN_LABEL: ${{ parameters.originLabel }}
      PULL_REQUEST_TARGET: ${{ parameters.targetBranch }}
      PULL_REQUEST_MERGE_STRATEGY: ${{ parameters.mergeStrategy }}
      PULL_REQUEST_AUTO_COMPLETE: ${{ parameters.autoComplete }}
      PULL_REQUEST_DELETE_SOURCE_BRANCH: ${{ parameters.deleteSourceBranch }}
      PULL_REQUEST_DRAFT: ${{ parameters.draft }}
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
