# ── CI Step: Azure Repos pull request ─────────────────────────────────────────
#
# Porta su un ramo le cartelle o i file che la pipeline ha scritto nel checkout di un repository Azure
# Repos e apre una PR verso targetBranch con il completamento automatico, che cancella il ramo a fine
# integrazione (V3/CI/Scripts/AzureRepos/Publish-PullRequest.ps1). Il ramo puo' gia' portare i commit
# di un passo precedente, come il testo di c4-describe.yaml con progressBranch: si riparte da li'. Se il
# contenuto non differisce da targetBranch non si apre nessuna PR; una PR attiva sullo stesso ramo si
# aggiorna. L'identita' della build deve poter contribuire al repository, creare rami e contribuire
# alle PR; il repository e' quello di origin del checkout, nel progetto della pipeline.
#
# Riusato da:
#   il consumer, dopo i passi che scrivono i file da proporre, es. c4-generate.yaml nella pipeline
#   della documentazione che rigenera la parte di un repository sorgente dopo la sua integrazione
#
# Parametri
# ─────────
#   paths              → cartelle o file da proporre, relativi a workingDirectory [REQUIRED]
#   branch             → ramo della PR [REQUIRED]
#   title              → titolo della PR e messaggio del commit [REQUIRED]
#   description        → descrizione della PR (default: nessuna)
#   originDirectory    → checkout del repository che ha causato la modifica: la descrizione ne cita
#                        l'ultimo commit, es. "Merged PR 12: ..." (default: nessuno)
#   targetBranch       → ramo di destinazione (default: main)
#   mergeStrategy      → noFastForward (default) | squash | rebase | rebaseMerge
#   workingDirectory   → checkout del repository della PR (default: $(Build.SourcesDirectory))
#   templatesDirectory → checkout del repo dei template (default: $(Pipeline.Workspace)/pipeline-templates)
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: paths
    type: object

  - name: branch
    type: string

  - name: title
    type: string

  - name: description
    type: string
    default: ''

  - name: originDirectory
    type: string
    default: ''

  - name: targetBranch
    type: string
    default: 'main'

  - name: mergeStrategy
    type: string
    default: 'noFastForward'
    values: ['noFastForward', 'squash', 'rebase', 'rebaseMerge']

  - name: workingDirectory
    type: string
    default: '$(Build.SourcesDirectory)'

  - name: templatesDirectory
    type: string
    default: '$(Pipeline.Workspace)/pipeline-templates'

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - task: PowerShell@2
    displayName: 'Pull request from ${{ parameters.branch }} to ${{ parameters.targetBranch }}'
    inputs:
      filePath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/AzureRepos/Publish-PullRequest.ps1'
      workingDirectory: '${{ parameters.workingDirectory }}'
      pwsh: true
    env:
      PULL_REQUEST_PATHS: ${{ join(';', parameters.paths) }}
      PULL_REQUEST_BRANCH: ${{ parameters.branch }}
      PULL_REQUEST_TITLE: ${{ parameters.title }}
      PULL_REQUEST_DESCRIPTION: ${{ parameters.description }}
      PULL_REQUEST_ORIGIN_DIRECTORY: ${{ parameters.originDirectory }}
      PULL_REQUEST_TARGET: ${{ parameters.targetBranch }}
      PULL_REQUEST_MERGE_STRATEGY: ${{ parameters.mergeStrategy }}
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
