# ── CI Step: C4 read Angular ──────────────────────────────────────────────────
#
# Lettore Angular del modello C4 generato (V3/CI/Scripts/Read-C4AngularModel.ps1): legge il workspace
# Angular del checkout del repository sorgente e scrive in fragmentDirectory il frammento che
# c4-generate.yaml unisce. L'applicazione e' un container con il nome del repository senza il
# prefisso comune ai repository sorgente; le cartelle di funzionalita' e i moduli di base con un file
# *.providers.ts sono componenti. Un progetto che non e' l'unica applicazione ferma la lettura.
#
# Riusato da:
#   il consumer, prima di c4-generate.yaml, per un repository sorgente con un'applicazione Angular
#
# Parametri
# ─────────
#   mode                      → 'off' | 'warn' (segnala senza bloccare) | 'enforce' (default)
#   sourceRepository          → nome del repository sorgente, es. $(Build.Repository.Name)
#   sourceDirectory           → checkout del repository sorgente (default: $(Build.SourcesDirectory))
#   sourceRepositories        → repository sorgente del documento separati da virgola, per il nome
#                               dell'applicazione senza il loro prefisso comune
#   angularFeatureDirectories → cartelle delle funzionalita' separate da virgola (default: app/features)
#   angularModuleDirectories  → cartelle dei moduli di base separate da virgola (default: app/core)
#   fragmentDirectory         → cartella dei frammenti (default: $(Agent.TempDirectory)/c4-fragments)
#   templatesDirectory        → checkout del repo dei template (default: $(Pipeline.Workspace)/pipeline-templates)
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: mode
    type: string
    default: 'enforce'
    values: ['off', 'warn', 'enforce']

  - name: sourceRepository
    type: string
    default: '$(Build.Repository.Name)'

  - name: sourceDirectory
    type: string
    default: '$(Build.SourcesDirectory)'

  - name: sourceRepositories
    type: string
    default: ''

  - name: angularFeatureDirectories
    type: string
    default: ''

  - name: angularModuleDirectories
    type: string
    default: ''

  - name: fragmentDirectory
    type: string
    default: '$(Agent.TempDirectory)/c4-fragments'

  - name: templatesDirectory
    type: string
    default: '$(Pipeline.Workspace)/pipeline-templates'

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - task: PowerShell@2
    displayName: 'C4 Angular application of ${{ parameters.sourceRepository }} (${{ parameters.mode }})'
    inputs:
      filePath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/Read-C4AngularModel.ps1'
      pwsh: true
    env:
      GATE_MODE: ${{ parameters.mode }}
      SOURCE_REPOSITORY: ${{ parameters.sourceRepository }}
      SOURCE_DIRECTORY: ${{ parameters.sourceDirectory }}
      FRAGMENT_DIRECTORY: ${{ parameters.fragmentDirectory }}
      ${{ if ne(parameters.sourceRepositories, '') }}:
        SOURCE_REPOSITORIES: ${{ parameters.sourceRepositories }}
      ${{ if ne(parameters.angularFeatureDirectories, '') }}:
        ANGULAR_FEATURE_DIRECTORIES: ${{ parameters.angularFeatureDirectories }}
      ${{ if ne(parameters.angularModuleDirectories, '') }}:
        ANGULAR_MODULE_DIRECTORIES: ${{ parameters.angularModuleDirectories }}
