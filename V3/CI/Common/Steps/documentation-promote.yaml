# ── CI Step: Promozione della bozza della documentazione ─────────────────────
#
# Primo passo della documentazione del ramo principale (V3/CI/Scripts/Documentation/Promote-Documentation.ps1):
# legge sourcesFile dal ramo draftBranch del documento e confronta l'albero git di ogni repository elencato con
# quello del checkout che la run documenta, e l'albero dei template che hanno scritto la bozza con quello del
# checkout dei template della run. Alberi tutti uguali: una PR in auto-complete da draftBranch a
# targetBranch, con merge e senza cancellare il ramo, porta la bozza gia' verificata nel documento ufficiale, e la
# variabile documentationPromoted vale True, cosi' modello, decisioni e testo (c4-read*, c4-describe, c4-generate,
# adr-register, documentation-update) non girano. Un albero diverso, anche quello dei template, un checkout, il
# file, la sua voce dei template o il ramo di bozza assenti: nessuna PR, e la run riscrive la documentazione come
# senza bozza. L'identita' della build deve leggere e contribuire al repository del documento e contribuire
# alle PR.
#
# Riusato da:
#   il consumer, come primo passo della documentazione dopo l'integrazione nel ramo principale
#
# Parametri
# ─────────
#   sourcesDirectory   → cartella con il checkout di ogni repository sorgente in <repository>
#                        (default: $(Pipeline.Workspace)/sources)
#   draftBranch        → ramo di bozza del documento (default: staging)
#   targetBranch       → ramo principale del documento (default: main)
#   sourcesFile        → file delle sorgenti della bozza (default: .draft-sources)
#   workingDirectory   → checkout del repository del documento (default: $(Build.SourcesDirectory))
#   templatesDirectory → checkout del repo dei template, confrontato con quello della bozza
#                        (default: $(Pipeline.Workspace)/pipeline-templates)
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: sourcesDirectory
    type: string
    default: '$(Pipeline.Workspace)/sources'

  - name: draftBranch
    type: string
    default: 'staging'

  - name: targetBranch
    type: string
    default: 'main'

  - name: sourcesFile
    type: string
    default: '.draft-sources'

  - name: workingDirectory
    type: string
    default: '$(Build.SourcesDirectory)'

  - name: templatesDirectory
    type: string
    default: '$(Pipeline.Workspace)/pipeline-templates'

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - task: PowerShell@2
    displayName: 'Promotion of the ${{ parameters.draftBranch }} documentation to ${{ parameters.targetBranch }}'
    inputs:
      filePath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/Documentation/Promote-Documentation.ps1'
      workingDirectory: '${{ parameters.workingDirectory }}'
      pwsh: true
    env:
      DRAFT_SOURCES_DIRECTORY: ${{ parameters.sourcesDirectory }}
      DRAFT_TEMPLATES_DIRECTORY: ${{ parameters.templatesDirectory }}
      DRAFT_SOURCES_FILE: ${{ parameters.sourcesFile }}
      DRAFT_BRANCH: ${{ parameters.draftBranch }}
      TARGET_BRANCH: ${{ parameters.targetBranch }}
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
