# ── CI Step: C4 context ───────────────────────────────────────────────────────
#
# Persone e sistemi esterni del modello C4 (V3/CI/Scripts/C4/Export-C4Context.ps1), dai testi che
# c4-describe.yaml ha scritto per ogni repository sorgente nella cartella delle parti generate: un file
# Structurizr DSL da includere nel modello prima del sistema. Si scrive quando il documento si compone e
# non si committa, cosi' le PR delle parti di due repository non toccano mai lo stesso file. Un
# identificativo dichiarato da piu' testi vale una volta. Tag seguono DOCUMENT_LANGUAGE
# (document-language.yaml).
#
# Riusato da:
#   il consumer, nella pipeline che compone il documento prima di verificarlo o pubblicarlo
#
# Parametri
# ─────────
#   mode               → 'off' | 'warn' (segnala senza bloccare) | 'enforce' (default)
#   generatedDirectory → cartella delle parti generate (default: docs/architecture/model/generated)
#   contextFile        → file del contesto da scrivere (default: docs/architecture/model/context.dsl)
#   workingDirectory   → checkout del repository del documento (default: $(Build.SourcesDirectory))
#   templatesDirectory → checkout del repo dei template (default: $(Pipeline.Workspace)/pipeline-templates)
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: mode
    type: string
    default: 'enforce'
    values: ['off', 'warn', 'enforce']

  - name: generatedDirectory
    type: string
    default: ''

  - name: contextFile
    type: string
    default: ''

  - name: workingDirectory
    type: string
    default: '$(Build.SourcesDirectory)'

  - name: templatesDirectory
    type: string
    default: '$(Pipeline.Workspace)/pipeline-templates'

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - task: PowerShell@2
    displayName: 'C4 model context (${{ parameters.mode }})'
    inputs:
      filePath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/C4/Export-C4Context.ps1'
      workingDirectory: '${{ parameters.workingDirectory }}'
      pwsh: true
    env:
      GATE_MODE: ${{ parameters.mode }}
      ${{ if ne(parameters.generatedDirectory, '') }}:
        GENERATED_DIRECTORY: ${{ parameters.generatedDirectory }}
      ${{ if ne(parameters.contextFile, '') }}:
        CONTEXT_FILE: ${{ parameters.contextFile }}
