# ── CI Step: Classi governate dalle decisioni ─────────────────────────────────
#
# Diagramma delle classi di ogni decisione aperta coerente con il codice che governa
# (V3/CI/Scripts/Adr/Test-DecisionClasses.ps1): una decisione con la parte della struttura nel codice
# dichiara nel frontmatter governs i pattern sui nomi completi delle classi che governa: prefissi che
# finiscono con * e contengono per intero il namespace di ogni classe che coprono, mai il nome di una
# sola classe ne' un namespace intero. Le classi di primo livello dei progetti .NET che non sono di
# test, nel codice dei repository sorgente, che corrispondono a quei pattern stanno in uno dei diagrammi
# delle classi della decisione; ogni voce di governs copre almeno una classe. Una classe del codice che
# nessun pattern copre non si controlla; una classe del diagramma che nessun pattern copre, anche del
# framework o assente dal codice, si segnala. Ogni rilievo nomina la decisione e la classe o la voce. Le
# decisioni superseded, deprecated e rejected non si controllano. I nomi delle parti seguono DOCUMENT_LANGUAGE
# (document-language.yaml). Il parser dei diagrammi richiede Node.js.
# In modalita' fix un modello linguistico propone prima le decisioni che la verifica respinge, che hanno
# classi candidate, le classi dei namespace governati che nessun pattern copre e che il registro
# candidatesFile non ha gia' visto, o che il registro readabilityFile non ha valutato nel testo corrente
# (V3/CI/Scripts/Adr/Repair-DecisionClasses.ps1): il modello giudica la leggibilita' dei diagrammi e divide
# per aspetto quelli che non si leggono, e risponde con le voci da aggiungere a governs e le parti della
# struttura e del flusso nel codice riscritte; lo script alza la versione della decisione e la verifica
# accetta o rimanda ogni stesura; una decisione con voci che non sono pattern validi non va al modello, che
# non toglie voci. Le decisioni accettate e i registri vanno sul ramo
# progressBranch, da cui una run rilanciata riprende senza richiamare il modello, e restano nel checkout
# per la PR che il consumer apre; la verifica che segue segnala senza bloccare, perche' il cancello e' la
# quality di quella PR. Con provider foundry l'accesso al modello passa dalla service connection con un
# token Entra ID (AzureCLI@2); con provider anthropic il modello e' Claude a consumo sull'API Anthropic, la
# proposta e' un PowerShell@2 senza service connection e la chiave e' una variabile segreta del consumer,
# mappata in ANTHROPIC_API_KEY. L'identita' della build deve poter creare il ramo progressBranch.
#
# Riusato da:
#   il consumer, dopo il checkout dei repository sorgente in sourceDirectory
#
# Parametri
# ─────────
#   mode               → 'off' | 'warn' (segnala senza bloccare) | 'enforce' (default) |
#                        'fix' (propone le decisioni con il modello, poi verifica come warn)
#   sourceDirectory    → cartella con il codice dei repository sorgente, letta per intero
#                        (default: $(Pipeline.Workspace)/sources)
#   decisionsDirectory → cartella degli ADR (default: quella dichiarata da document-directories.yaml,
#                        altrimenti docs/decisions)
#   provider           → fornitore del modello della proposta: 'foundry' (default) | 'anthropic'
#   serviceConnection  → service connection Azure con il ruolo Cognitive Services OpenAI User [REQUIRED con foundry
#                        in modalita' fix]
#   endpoint           → endpoint della risorsa Azure OpenAI, es. https://<nome>.openai.azure.com [REQUIRED con
#                        foundry in modalita' fix]; con anthropic vuoto vuol dire https://api.anthropic.com
#   model              → deployment Foundry o modello Anthropic [REQUIRED in modalita' fix]
#   anthropicApiKey    → chiave dell'API Anthropic, con anthropic (default: $(anthropicApiKey), la variabile
#                        segreta del consumer: una variabile segreta arriva allo script solo cosi')
#   reasoningEffort    → ragionamento del modello (default: high)
#   maxDrafts          → stesure massime per decisione (default: 3)
#   maxTokens          → tetto dei token di una risposta del modello, ragionamento compreso (default: 0, il default
#                        del modulo del fornitore)
#   guide              → guida di stile del documento, per la spiegazione riscritta (default: docs/STYLE.md)
#   progressBranch     → ramo su cui si salvano le decisioni accettate, es. il ramo della PR del consumer
#                        (default: nessuno, nessuna ripresa)
#   candidatesFile     → registro delle classi candidate gia' viste dal modello, relativo ai sorgenti
#                        (default: nessuno: ogni run ripropone le candidate)
#   readabilityFile    → registro delle decisioni di cui il modello ha giudicato la leggibilita', relativo ai
#                        sorgenti (default: nessuno: una decisione senza rilievi ne' candidate non va al modello)
#   nodeVersion        → versione di Node.js per il parser (default: 22.x)
#   templatesDirectory → checkout del repo dei template (default: $(Pipeline.Workspace)/pipeline-templates)
#   condition          → condizione dei passi (default: succeeded())
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: mode
    type: string
    default: 'enforce'
    values: ['off', 'warn', 'enforce', 'fix']

  - name: sourceDirectory
    type: string
    default: '$(Pipeline.Workspace)/sources'

  - name: decisionsDirectory
    type: string
    default: ''

  - name: provider
    type: string
    default: 'foundry'
    values: ['foundry', 'anthropic']

  - name: serviceConnection
    type: string
    default: ''

  - name: endpoint
    type: string
    default: ''

  - name: model
    type: string
    default: ''

  - name: reasoningEffort
    type: string
    default: 'high'

  - name: anthropicApiKey
    type: string
    default: '$(anthropicApiKey)'

  - name: maxDrafts
    type: number
    default: 3

  - name: maxTokens
    type: number
    default: 0

  - name: guide
    type: string
    default: 'docs/STYLE.md'

  - name: progressBranch
    type: string
    default: ''

  - name: candidatesFile
    type: string
    default: ''

  - name: readabilityFile
    type: string
    default: ''

  - name: nodeVersion
    type: string
    default: '22.x'

  - name: templatesDirectory
    type: string
    default: '$(Pipeline.Workspace)/pipeline-templates'

  - name: condition
    type: string
    default: 'succeeded()'

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - ${{ if ne(parameters.mode, 'off') }}:
    - task: UseNode@1
      displayName: 'Install Node.js'
      condition: ${{ parameters.condition }}
      inputs:
        version: ${{ parameters.nodeVersion }}

  - ${{ if and(eq(parameters.mode, 'fix'), eq(parameters.provider, 'foundry')) }}:
    - template: ensure-azure-cli.yaml

    - task: AzureCLI@2
      displayName: 'Classes of the decisions proposed from the code'
      condition: ${{ parameters.condition }}
      inputs:
        azureSubscription: ${{ parameters.serviceConnection }}
        scriptType: pscore
        scriptLocation: scriptPath
        scriptPath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/Adr/Repair-DecisionClasses.ps1'
        workingDirectory: '$(Build.SourcesDirectory)'
      env:
        GATE_MODE: enforce
        SOURCE_DIRECTORY: ${{ parameters.sourceDirectory }}
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        CLASSES_REPAIR_ENDPOINT: ${{ parameters.endpoint }}
        CLASSES_REPAIR_MODEL: ${{ parameters.model }}
        CLASSES_REPAIR_REASONING_EFFORT: ${{ parameters.reasoningEffort }}
        CLASSES_REPAIR_MAX_DRAFTS: ${{ parameters.maxDrafts }}
        CLASSES_REPAIR_MAX_TOKENS: ${{ parameters.maxTokens }}
        CLASSES_REPAIR_PROVIDER: ${{ parameters.provider }}
        PROGRESS_BRANCH: ${{ parameters.progressBranch }}
        CANDIDATES_FILE: ${{ parameters.candidatesFile }}
        READABILITY_FILE: ${{ parameters.readabilityFile }}
        STYLE_GUIDE: ${{ parameters.guide }}
        ${{ if ne(parameters.decisionsDirectory, '') }}:
          DECISIONS_DIRECTORY: ${{ parameters.decisionsDirectory }}

  - ${{ if and(eq(parameters.mode, 'fix'), eq(parameters.provider, 'anthropic')) }}:
    - task: PowerShell@2
      displayName: 'Classes of the decisions proposed from the code'
      condition: ${{ parameters.condition }}
      inputs:
        filePath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/Adr/Repair-DecisionClasses.ps1'
        workingDirectory: '$(Build.SourcesDirectory)'
        pwsh: true
      env:
        GATE_MODE: enforce
        SOURCE_DIRECTORY: ${{ parameters.sourceDirectory }}
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        CLASSES_REPAIR_ENDPOINT: ${{ parameters.endpoint }}
        CLASSES_REPAIR_MODEL: ${{ parameters.model }}
        CLASSES_REPAIR_REASONING_EFFORT: ${{ parameters.reasoningEffort }}
        CLASSES_REPAIR_MAX_DRAFTS: ${{ parameters.maxDrafts }}
        CLASSES_REPAIR_MAX_TOKENS: ${{ parameters.maxTokens }}
        CLASSES_REPAIR_PROVIDER: ${{ parameters.provider }}
        ANTHROPIC_API_KEY: ${{ parameters.anthropicApiKey }}
        PROGRESS_BRANCH: ${{ parameters.progressBranch }}
        CANDIDATES_FILE: ${{ parameters.candidatesFile }}
        READABILITY_FILE: ${{ parameters.readabilityFile }}
        STYLE_GUIDE: ${{ parameters.guide }}
        ${{ if ne(parameters.decisionsDirectory, '') }}:
          DECISIONS_DIRECTORY: ${{ parameters.decisionsDirectory }}

  - task: PowerShell@2
    displayName: 'Classes governed by the decisions (${{ parameters.mode }})'
    condition: ${{ parameters.condition }}
    inputs:
      filePath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/Adr/Test-DecisionClasses.ps1'
      workingDirectory: '$(Build.SourcesDirectory)'
      pwsh: true
    env:
      GATE_MODE: ${{ replace(parameters.mode, 'fix', 'warn') }}
      SOURCE_DIRECTORY: ${{ parameters.sourceDirectory }}
      ${{ if ne(parameters.decisionsDirectory, '') }}:
        DECISIONS_DIRECTORY: ${{ parameters.decisionsDirectory }}
