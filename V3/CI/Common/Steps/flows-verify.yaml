# ── CI Step: Flussi ───────────────────────────────────────────────────────────
#
# Flussi coerenti con la struttura del documento (V3/CI/Scripts/Mermaid/Test-DiagramFlows.ps1):
# ogni flusso delle sezioni ha un diagramma di sequenza Mermaid a livello dei container del modello C4
# (c4/workspace.dsl), nei dettagli ogni componente sta nel riquadro del suo container e ogni
# chiamata e' una relazione del modello; una decisione con la parte della struttura nel codice ha la
# parte del flusso nel codice, con un diagramma di sequenza fatto delle classi del suo diagramma delle
# classi. I nomi delle parti seguono DOCUMENT_LANGUAGE (document-language.yaml). Un partecipante e'
# un elemento del modello per il suo identificativo, l'alias, e ne porta il nome come etichetta.
# In modalita' fix, in una PR, i diagrammi si allineano prima al modello
# (V3/CI/Scripts/Mermaid/Sync-DiagramLabels.ps1): le righe cambiate tornano sul ramo della PR con un
# commit dell'identita' della build, che deve poter contribuire al repository, e la verifica riparte
# dalla build di quel commit. Con endpoint, in modalita' fix, un modello Azure OpenAI ripara poi le sezioni
# che la verifica respinge ancora, per esempio per un elemento tolto dal modello o una chiamata che il
# modello fa passare per altri elementi (V3/CI/Scripts/Mermaid/Repair-DiagramFlows.ps1): riceve il modello,
# i rilievi e la sezione, e riscrive i diagrammi e le frasi che li descrivono; la verifica dei flussi
# accetta o rimanda ogni stesura. Le sezioni accettate passano da un ramo di appoggio, cosi' una build
# interrotta riparte da li', e tornano sul ramo della PR: l'identita' della build deve anche poter creare
# e cancellare rami. L'accesso al modello passa dalla service connection con un token Entra ID, senza chiavi.
# Richiede Java 17 per la Structurizr CLI e Node.js per il parser Mermaid.
#
# Riusato da:
#   il consumer, nel parametro diagramSteps di CI/Agnostic/quality-arc42.yaml e
#   CI/Agnostic/quality-docs.yaml
#
# Parametri
# ─────────
#   mode               → 'off' | 'warn' (segnala senza bloccare) | 'enforce' (default) |
#                        'fix' (in una PR allinea i diagrammi al modello, poi verifica come enforce)
#   docsDirectory      → cartella delle sezioni del documento (default: quella dichiarata da
#                        document-directories.yaml, altrimenti docs/architecture)
#   decisionsDirectory → cartella degli ADR (default: quella dichiarata da document-directories.yaml,
#                        altrimenti docs/decisions)
#   serviceConnection  → service connection Azure con il ruolo Cognitive Services OpenAI User [REQUIRED con endpoint]
#   endpoint           → endpoint della risorsa Azure OpenAI, es. https://<nome>.openai.azure.com: in modalita'
#                        fix attiva la riparazione dei diagrammi (default: nessuno, nessuna riparazione)
#   model              → nome del deployment del modello [REQUIRED con endpoint]
#   reasoningEffort    → ragionamento del modello (default: high)
#   maxDrafts          → stesure massime per sezione (default: 3)
#   guide              → guida di stile del documento, per le frasi riscritte (default: docs/STYLE.md)
#   nodeVersion        → versione di Node.js per il parser (default: 22.x)
#   templatesDirectory → checkout del repo dei template (default: $(Pipeline.Workspace)/pipeline-templates)
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: mode
    type: string
    default: 'enforce'
    values: ['off', 'warn', 'enforce', 'fix']

  - name: docsDirectory
    type: string
    default: ''

  - name: decisionsDirectory
    type: string
    default: ''

  - name: serviceConnection
    type: string
    default: ''

  - name: endpoint
    type: string
    default: ''

  - name: model
    type: string
    default: ''

  - name: reasoningEffort
    type: string
    default: 'high'

  - name: maxDrafts
    type: number
    default: 3

  - name: guide
    type: string
    default: 'docs/STYLE.md'

  - name: nodeVersion
    type: string
    default: '22.x'

  - name: templatesDirectory
    type: string
    default: '$(Pipeline.Workspace)/pipeline-templates'

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - ${{ if ne(parameters.mode, 'off') }}:
    - template: ensure-java.yaml

    - task: UseNode@1
      displayName: 'Install Node.js'
      inputs:
        version: ${{ parameters.nodeVersion }}

  - ${{ if eq(parameters.mode, 'fix') }}:
    - task: PowerShell@2
      displayName: 'Diagram participants aligned with the C4 model'
      inputs:
        filePath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/Mermaid/Sync-DiagramLabels.ps1'
        workingDirectory: '$(Build.SourcesDirectory)'
        pwsh: true
      env:
        GATE_MODE: enforce
        SOURCE_BRANCH: $(System.PullRequest.SourceBranch)
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        ${{ if ne(parameters.docsDirectory, '') }}:
          DOCS_DIRECTORY: ${{ parameters.docsDirectory }}

  - ${{ if and(eq(parameters.mode, 'fix'), ne(parameters.endpoint, '')) }}:
    - template: ensure-azure-cli.yaml

    - task: AzureCLI@2
      displayName: 'Diagram flows repaired with the C4 model'
      inputs:
        azureSubscription: ${{ parameters.serviceConnection }}
        scriptType: pscore
        scriptLocation: scriptPath
        scriptPath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/Mermaid/Repair-DiagramFlows.ps1'
        workingDirectory: '$(Build.SourcesDirectory)'
      env:
        GATE_MODE: enforce
        SOURCE_BRANCH: $(System.PullRequest.SourceBranch)
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        FLOWS_REPAIR_ENDPOINT: ${{ parameters.endpoint }}
        FLOWS_REPAIR_MODEL: ${{ parameters.model }}
        FLOWS_REPAIR_REASONING_EFFORT: ${{ parameters.reasoningEffort }}
        FLOWS_REPAIR_MAX_DRAFTS: ${{ parameters.maxDrafts }}
        STYLE_GUIDE: ${{ parameters.guide }}
        ${{ if ne(parameters.docsDirectory, '') }}:
          DOCS_DIRECTORY: ${{ parameters.docsDirectory }}
        ${{ if ne(parameters.decisionsDirectory, '') }}:
          DECISIONS_DIRECTORY: ${{ parameters.decisionsDirectory }}

  - task: PowerShell@2
    displayName: 'Diagram flows (${{ parameters.mode }})'
    inputs:
      filePath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/Mermaid/Test-DiagramFlows.ps1'
      workingDirectory: '$(Build.SourcesDirectory)'
      pwsh: true
    env:
      GATE_MODE: ${{ replace(parameters.mode, 'fix', 'enforce') }}
      ${{ if ne(parameters.docsDirectory, '') }}:
        DOCS_DIRECTORY: ${{ parameters.docsDirectory }}
      ${{ if ne(parameters.decisionsDirectory, '') }}:
        DECISIONS_DIRECTORY: ${{ parameters.decisionsDirectory }}
