# ── CI Step: Angular Publish ───────────────────────────────────────────────────
#
# Step template condiviso per la fase di publish di progetti Angular.
# Contiene: installazione Node.js, npm ci, ng build, copia dist in artifact staging.
#
# Riusato da:
#   CI/Agnostic/publish-angular.yaml
#   CI/GitFlow/publish-angular.yaml
#
# Parametri
# ─────────
#   projectName        → nome repo (per workingDirectory e path output)
#   nodeVersion        → versione Node.js        (default: variabile $(nodeVersion))
#   outputDirectory    → path output artifact    (default: variabile $(outputDirectory))
#   buildConfiguration → configurazione Angular  (default: variabile $(buildConfiguration))
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: projectName
    type: string

  - name: nodeVersion
    type: string
    default: '$(nodeVersion)'

  - name: outputDirectory
    type: string
    default: '$(outputDirectory)'

  - name: buildConfiguration
    type: string
    default: '$(buildConfiguration)'

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - task: UseNode@1
    displayName: 'Install Node.js'
    inputs:
      version: ${{ parameters.nodeVersion }}

  - script: npm ci
    displayName: 'Install Dependencies'
    workingDirectory: $(Build.SourcesDirectory)/${{ parameters.projectName }}

  - script: npx ng build --configuration=${{ parameters.buildConfiguration }}
    displayName: 'Angular Build'
    workingDirectory: $(Build.SourcesDirectory)/${{ parameters.projectName }}

  # PowerShell (non bash): gli agent self-hosted Windows di questo runtime non hanno
  # bash.exe garantito sul PATH. Individua dinamicamente la cartella di output reale
  # di ng build (varia tra 'dist/<project>' e 'dist/<project>/browser' a seconda
  # della versione Angular) cercando index.html, poi copia il suo contenuto.
  - powershell: |
      New-Item -ItemType Directory -Force -Path '${{ parameters.outputDirectory }}' | Out-Null
      $realOutput = (Get-ChildItem -Path dist -Recurse -Filter 'index.html' | Select-Object -First 1).DirectoryName
      Write-Host "Copia dei file da $realOutput a ${{ parameters.outputDirectory }}"
      Copy-Item -Path (Join-Path $realOutput '*') -Destination '${{ parameters.outputDirectory }}' -Recurse -Force
    displayName: 'Copy dist to Artifact Staging'
    workingDirectory: $(Build.SourcesDirectory)/${{ parameters.projectName }}
