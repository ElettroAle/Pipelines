# ── CI Step: Documentation ────────────────────────────────────────────────────
#
# Controlli oggettivi che valgono per ogni documento (V3/CI/Scripts/Test-Documentation.ps1):
# rimandi a file, ancore e decisioni esistenti, soglie numeriche di leggibilita'. La
# struttura la verifica lo step del formato (es. arc42-verify.yaml), i diagrammi gli step
# iniettati dal consumer, lo stile documentation-style.yaml.
#
# Riusato da:
#   CI/Agnostic/quality-arc42.yaml
#   CI/Agnostic/quality-docs.yaml
#
# Parametri
# ─────────
#   mode               → 'off' | 'warn' (segnala senza bloccare) | 'enforce' (default)
#   docsDirectory      → cartella delle sezioni del documento (default: docs/architecture)
#   gulpease           → indice Gulpease minimo del testo di ogni sezione (default: 0, nessuna soglia)
#   maxWords           → parole massime per frase (default: 0, nessuna soglia)
#   abbreviations      → abbreviazioni che non chiudono una frase (default: nessuna)
#   decisionsDirectory → cartella degli ADR a cui puntano i rimandi (default: docs/decisions)
#   templatesDirectory → checkout del repo dei template (default: $(Pipeline.Workspace)/pipeline-templates)
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: mode
    type: string
    default: 'enforce'
    values: ['off', 'warn', 'enforce']

  - name: docsDirectory
    type: string
    default: 'docs/architecture'

  - name: gulpease
    type: number
    default: 0

  - name: maxWords
    type: number
    default: 0

  - name: abbreviations
    type: object
    default: []

  - name: decisionsDirectory
    type: string
    default: 'docs/decisions'

  - name: templatesDirectory
    type: string
    default: '$(Pipeline.Workspace)/pipeline-templates'

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - task: PowerShell@2
    displayName: 'Documentation ${{ parameters.docsDirectory }} (${{ parameters.mode }})'
    inputs:
      filePath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/Test-Documentation.ps1'
      workingDirectory: '$(Build.SourcesDirectory)'
      pwsh: true
    env:
      GATE_MODE: ${{ parameters.mode }}
      DOCS_DIRECTORY: ${{ parameters.docsDirectory }}
      READABILITY_GULPEASE: ${{ parameters.gulpease }}
      READABILITY_MAX_WORDS: ${{ parameters.maxWords }}
      READABILITY_ABBREVIATIONS: ${{ join(';', parameters.abbreviations) }}
      DECISIONS_DIRECTORY: ${{ parameters.decisionsDirectory }}
