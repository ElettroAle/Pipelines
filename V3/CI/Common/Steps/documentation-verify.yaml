# ── CI Step: Documentation ────────────────────────────────────────────────────
#
# Controlli oggettivi su un documento del repository (V3/CI/Scripts/Test-Documentation.ps1):
# le sezioni del template dichiarato, il modello C4 in Structurizr DSL se la cartella del
# documento contiene model/workspace.dsl, diagrammi Mermaid validi, rimandi esistenti, soglie
# numeriche di leggibilita'. Lo stile lo giudica documentation-style.yaml.
# La Structurizr CLI richiede Java 17, il parser Mermaid Node.js.
#
# Riusato da:
#   CI/Agnostic/quality-docs.yaml
#
# Parametri
# ─────────
#   mode               → 'off' | 'warn' (segnala senza bloccare) | 'enforce' (default)
#   docsDirectory      → cartella delle sezioni del documento (default: docs/architecture)
#   documentTemplate       → template del documento: URL di un archivio zip, oppure archivio o cartella del repository [REQUIRED se mode non e' off]
#   documentTemplateSha256 → SHA-256 dell'archivio del template [REQUIRED se documentTemplate e' un URL]
#   gulpease           → indice Gulpease minimo del testo di ogni sezione (default: 0, nessuna soglia)
#   maxWords           → parole massime per frase (default: 0, nessuna soglia)
#   abbreviations      → abbreviazioni che non chiudono una frase (default: nessuna)
#   decisionsDirectory → cartella degli ADR a cui puntano i rimandi (default: docs/decisions)
#   nodeVersion        → versione di Node.js per il parser Mermaid (default: 22.x)
#   templatesDirectory → checkout del repo dei template (default: $(Pipeline.Workspace)/pipeline-templates)
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: mode
    type: string
    default: 'enforce'
    values: ['off', 'warn', 'enforce']

  - name: docsDirectory
    type: string
    default: 'docs/architecture'

  - name: documentTemplate
    type: string
    default: ''

  - name: documentTemplateSha256
    type: string
    default: ''

  - name: gulpease
    type: number
    default: 0

  - name: maxWords
    type: number
    default: 0

  - name: abbreviations
    type: object
    default: []

  - name: decisionsDirectory
    type: string
    default: 'docs/decisions'

  - name: nodeVersion
    type: string
    default: '22.x'

  - name: templatesDirectory
    type: string
    default: '$(Pipeline.Workspace)/pipeline-templates'

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - ${{ if ne(parameters.mode, 'off') }}:
    - template: ensure-java.yaml

    - task: UseNode@1
      displayName: 'Install Node.js'
      inputs:
        version: ${{ parameters.nodeVersion }}

  - task: PowerShell@2
    displayName: 'Documentation ${{ parameters.docsDirectory }} (${{ parameters.mode }})'
    inputs:
      filePath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/Test-Documentation.ps1'
      workingDirectory: '$(Build.SourcesDirectory)'
      pwsh: true
    env:
      GATE_MODE: ${{ parameters.mode }}
      DOCS_DIRECTORY: ${{ parameters.docsDirectory }}
      DOCS_TEMPLATE: ${{ parameters.documentTemplate }}
      DOCS_TEMPLATE_SHA256: ${{ parameters.documentTemplateSha256 }}
      READABILITY_GULPEASE: ${{ parameters.gulpease }}
      READABILITY_MAX_WORDS: ${{ parameters.maxWords }}
      READABILITY_ABBREVIATIONS: ${{ join(';', parameters.abbreviations) }}
      DECISIONS_DIRECTORY: ${{ parameters.decisionsDirectory }}
