# ── CI Step: DotNet Test + Coverage ───────────────────────────────────────────
#
# Step template condiviso per l'esecuzione dei test e la pubblicazione
# del code coverage in progetti .NET.
#
# Riusato da:
#   CI/Agnostic/quality-dotNet.yaml
#   CI/GitFlow/quality-dotNet.yaml
#   CI/Agnostic/publish-dotNet.yaml
#   CI/GitFlow/publish-dotNet.yaml
#   CI/TrunkFlow/publish-dotNet.yaml
#
# Parametri
# ─────────
#   buildConfiguration → configurazione build   (default: variabile $(buildConfiguration))
#   testProjects       → glob pattern test proj  (default: variabile $(testProjects))
#   cucumberMessagesFile → se valorizzato, Reqnroll scrive i Cucumber Messages
#                          in quel path relativo all'output di ogni progetto
#                          (default: '', formatter non attivato)
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: buildConfiguration
    type: string
    default: '$(buildConfiguration)'

  - name: testProjects
    type: string
    default: '$(testProjects)'

  # I template di quality compilano i progetti di test insieme al resto; nelle
  # publish il build tocca solo il csproj dell'app, quindi li' il valore va
  # svuotato perche' sia questo step a compilarli.
  - name: buildArguments
    type: string
    default: '--no-build --no-restore'

  - name: cucumberMessagesFile
    type: string
    default: ''

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - task: DotNetCoreCLI@2
    displayName: 'Test'
    inputs:
      command: 'test'
      projects: '${{ parameters.testProjects }}'
      arguments: '--configuration ${{ parameters.buildConfiguration }} ${{ parameters.buildArguments }} --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura'
    # La variabile d'ambiente sostituisce solo la sezione 'message' dei formatter:
    # il reqnroll.json del repo applicativo resta com'e'.
    ${{ if ne(parameters.cucumberMessagesFile, '') }}:
      env:
        REQNROLL_FORMATTERS: '{"formatters":{"message":{"outputFilePath":"${{ parameters.cucumberMessagesFile }}"}}}'

  - task: PublishCodeCoverageResults@2
    displayName: 'Publish Code Coverage'
    inputs:
      codeCoverageTool: 'Cobertura'
      summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'
      additionalCodeCoverageFiles: '$(Agent.TempDirectory)/**/coverage.opencover.xml'
