# ── CI Step: arc42 wiki publish ──────────────────────────────────────────────
#
# Pubblica un documento arc42 in una wiki git di Azure DevOps
# (V3/CI/Scripts/Arc42/Publish-Arc42Wiki.ps1): una pagina per sezione sotto wikiRoot, le decisioni
# sotto la sezione 9, le viste C4 come immagini C4-PlantUML. Un commit solo nel repository
# della wiki, che tocca soltanto wikiRoot, le sue immagini e la sua voce nell'ordine della radice.
# PlantUML richiede Java e i font di sistema.
# Con documentFormats lo stesso commit allega il documento unico in PDF e Word, che la pagina wikiRoot
# nomina (V3/CI/Scripts/Arc42/Arc42Document.ps1): pandoc si scarica alla prima esecuzione, Chrome
# headless richiede Node.js e, su Linux, le sue librerie di sistema.
# Con draftDocsDirectory ogni pagina che il documento in bozza cambia, o che esiste solo nella bozza, ha una
# pagina sorella con il suffisso della lingua (es. « (bozza)»), l'avviso della bozza in testa e le immagini sotto
# .attachments/<wikiRoot>/draft; la pagina ufficiale rimanda alla sua bozza. PDF e Word restano quelli ufficiali.
#
# Riusato da:
#   CI/Agnostic/publish-arc42-wiki.yaml
#
# Parametri
# ─────────
#   language           → lingua del documento, es. 'IT' o 'EN' (V3/CI/Scripts/Common/Languages) [REQUIRED]
#   wikiDirectory      → checkout del repository della wiki [REQUIRED]
#   wikiBranch         → ramo della wiki (default: wikiMaster, il ramo della wiki di progetto)
#   wikiRoot           → pagina sotto cui nasce il documento (default: il nome dell'architettura
#                        nella lingua del documento)
#   docsDirectory      → cartella delle sezioni (default: docs/architecture)
#   decisionsDirectory → cartella degli ADR (default: docs/decisions)
#   sourcesDirectory   → checkout del repository del documento (default: $(Build.SourcesDirectory))
#   templatesDirectory → checkout del repo dei template (default: $(Pipeline.Workspace)/pipeline-templates)
#   documentFormats    → formati del documento unico da allegare, 'pdf' e 'docx' (default: nessuno)
#   nodeVersion        → versione di Node.js per Chrome headless (default: 22.x)
#   referenceRoot      → radice della reference nella wiki (reference-publish.yaml): la prima menzione di
#                        ogni sua voce nelle pagine diventa un link, il documento unico resta senza
#                        (default: nessuna)
#   draftDocsDirectory      → cartella delle sezioni del documento in bozza (default: nessuna bozza)
#   draftDecisionsDirectory → cartella degli ADR del documento in bozza (default: nessuna)
#   draftBranch             → ramo della bozza, nominato nell'avviso delle pagine (default: staging)
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: language
    type: string

  - name: wikiDirectory
    type: string

  - name: wikiBranch
    type: string
    default: 'wikiMaster'

  - name: wikiRoot
    type: string
    default: ''

  - name: docsDirectory
    type: string
    default: 'docs/architecture'

  - name: decisionsDirectory
    type: string
    default: 'docs/decisions'

  - name: sourcesDirectory
    type: string
    default: '$(Build.SourcesDirectory)'

  - name: templatesDirectory
    type: string
    default: '$(Pipeline.Workspace)/pipeline-templates'

  - name: documentFormats
    type: object
    default: []

  - name: nodeVersion
    type: string
    default: '22.x'

  - name: referenceRoot
    type: string
    default: ''

  - name: draftDocsDirectory
    type: string
    default: ''

  - name: draftDecisionsDirectory
    type: string
    default: ''

  - name: draftBranch
    type: string
    default: 'staging'

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - template: ensure-java.yaml

  - template: ensure-fonts.yaml

  - ${{ if ne(length(parameters.documentFormats), 0) }}:
    - task: UseNode@1
      displayName: 'Install Node.js'
      inputs:
        version: ${{ parameters.nodeVersion }}

    - template: ensure-chrome-libraries.yaml

  - task: PowerShell@2
    displayName: 'Publish ${{ parameters.docsDirectory }} to the wiki'
    inputs:
      filePath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/Arc42/Publish-Arc42Wiki.ps1'
      workingDirectory: '${{ parameters.sourcesDirectory }}'
      pwsh: true
    env:
      DOCS_DIRECTORY: ${{ parameters.docsDirectory }}
      DECISIONS_DIRECTORY: ${{ parameters.decisionsDirectory }}
      DOCUMENT_LANGUAGE: ${{ parameters.language }}
      WIKI_DIRECTORY: ${{ parameters.wikiDirectory }}
      WIKI_ROOT: ${{ parameters.wikiRoot }}
      WIKI_BRANCH: ${{ parameters.wikiBranch }}
      DOCUMENT_FORMATS: ${{ join(',', parameters.documentFormats) }}
      REFERENCE_ROOT: ${{ parameters.referenceRoot }}
      DRAFT_DOCS_DIRECTORY: ${{ parameters.draftDocsDirectory }}
      DRAFT_DECISIONS_DIRECTORY: ${{ parameters.draftDecisionsDirectory }}
      DRAFT_BRANCH: ${{ parameters.draftBranch }}
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
