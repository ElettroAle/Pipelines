# ── CI Step: Sorgenti della bozza della documentazione ───────────────────────
#
# Su una run che scrive la bozza del documento (targetBranch diverso da main) registra nel checkout del
# documento il file sourcesFile, in JSON: per ogni repository sorgente il ramo letto, il commit e l'albero git
# del commit (V3/CI/Scripts/Documentation/Write-DraftSources.ps1). Il ramo letto e' sourceBranch, main per un
# repository che non lo ha. documentation-promote.yaml confronta questi alberi con quelli del ramo principale.
# Con targetBranch main il passo non scrive nulla. Il file entra nella PR della bozza con i paths del consumer.
#
# Riusato da:
#   il consumer, nella pipeline che scrive la bozza, prima del passo che apre la PR sul ramo di bozza
#
# Parametri
# ─────────
#   sourceRepositories → repository sorgente della bozza [REQUIRED]
#   sourcesDirectory   → cartella con il checkout di ogni repository sorgente in <repository>
#                        (default: $(Pipeline.Workspace)/sources)
#   sourceBranch       → ramo dei repository sorgente (default: targetBranch)
#   targetBranch       → ramo del documento della run (default: main)
#   sourcesFile        → file delle sorgenti, relativo a workingDirectory (default: .draft-sources)
#   workingDirectory   → checkout del repository del documento (default: $(Build.SourcesDirectory))
#   templatesDirectory → checkout del repo dei template (default: $(Pipeline.Workspace)/pipeline-templates)
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: sourceRepositories
    type: object

  - name: sourcesDirectory
    type: string
    default: '$(Pipeline.Workspace)/sources'

  - name: sourceBranch
    type: string
    default: ''

  - name: targetBranch
    type: string
    default: 'main'

  - name: sourcesFile
    type: string
    default: '.draft-sources'

  - name: workingDirectory
    type: string
    default: '$(Build.SourcesDirectory)'

  - name: templatesDirectory
    type: string
    default: '$(Pipeline.Workspace)/pipeline-templates'

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - task: PowerShell@2
    displayName: 'Sources of the ${{ parameters.targetBranch }} documentation'
    inputs:
      filePath: '${{ parameters.templatesDirectory }}/V3/CI/Scripts/Documentation/Write-DraftSources.ps1'
      workingDirectory: '${{ parameters.workingDirectory }}'
      pwsh: true
    env:
      DRAFT_SOURCE_REPOSITORIES: ${{ join(';', parameters.sourceRepositories) }}
      DRAFT_SOURCES_DIRECTORY: ${{ parameters.sourcesDirectory }}
      DRAFT_SOURCES_FILE: ${{ parameters.sourcesFile }}
      SOURCE_BRANCH: ${{ parameters.sourceBranch }}
      TARGET_BRANCH: ${{ parameters.targetBranch }}
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
