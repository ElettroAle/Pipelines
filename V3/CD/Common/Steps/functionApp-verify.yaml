# ── CD Step: Verifica di una Azure Function App dopo il rilascio ──────────────
#
# Step template atomico che verifica una Function App appena rilasciata con uno
# script PowerShell del repo applicativo. Fa il checkout del repo applicativo,
# legge con la service connection l'host e la chiave di funzione predefinita
# (mascherata nei log) e li passa allo script. Uno script che esce con un codice
# diverso da 0 fa fallire lo step, e quindi il rilascio.
#
# Contratto dello script: accetta -BaseUrl (es. https://func-myapp.azurewebsites.net)
# e -FunctionKey, ed esce con 0 solo se la verifica è superata.
#
# Riusato da:
#   CD/Agnostic/deploy-azure-functionApp.yaml (postDeploySteps del raccordo)
#
# Parametri
# ─────────
#   azureServiceConnection → nome service connection ARM in Azure DevOps
#   resourceGroupName      → gruppo di risorse della Function App
#   functionAppName        → nome completo Function App (es. func-myapp-be-staging)
#   scriptPath             → percorso dello script dalla root del repo applicativo
#                            (default: variabile $(verifyScriptPath))
#
# ─────────────────────────────────────────────────────────────────────────────

parameters:
  - name: azureServiceConnection
    type: string

  - name: resourceGroupName
    type: string

  - name: functionAppName
    type: string

  - name: scriptPath
    type: string
    default: '$(verifyScriptPath)'

# ─────────────────────────────────────────────────────────────────────────────

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: 'Verifica dopo il rilascio — ${{ parameters.functionAppName }}'
    inputs:
      azureSubscription: '${{ parameters.azureServiceConnection }}'
      scriptType: 'pscore'
      scriptLocation: 'inlineScript'
      workingDirectory: '$(Build.SourcesDirectory)'
      inlineScript: |
        $hostName = az functionapp show --resource-group '${{ parameters.resourceGroupName }}' --name '${{ parameters.functionAppName }}' --query defaultHostName --output tsv
        $functionKey = az functionapp keys list --resource-group '${{ parameters.resourceGroupName }}' --name '${{ parameters.functionAppName }}' --query functionKeys.default --output tsv
        Write-Host "##vso[task.setsecret]$functionKey"
        & './${{ parameters.scriptPath }}' -BaseUrl "https://$hostName" -FunctionKey $functionKey
        exit $LASTEXITCODE
